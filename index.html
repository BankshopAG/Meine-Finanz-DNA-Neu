/* Die FinanzDNA als Punktwertung ist entfallen. Eine Wertung, die man dem
   Kunden erst erklären muss, hilft im Termin nicht - und eine, die man nicht
   erklären muss, hätte nichts zu sagen gehabt. Was bleibt, ist der Überblick
   über seine eigenen Angaben. Die Nummer läuft als schlichte Vorgangsnummer
   weiter, damit Ausdruck, Datei und Termin zusammenfinden. */

/* ---- Die FinanzDNA -----------------------------------------------------
   Eine Punktwertung, die der Kunde nachzaehlen kann: Jeder Punkt steht fuer
   genau eine Frage, die er im Bogen beantwortet hat. Nichts ist gerechnet,
   nichts geschaetzt, nichts gewichtet - deshalb muss auch nichts erklaert
   werden.

   Die Bereiche stehen in SEINER Rangfolge. Damit sind Ziele und Punkte eine
   Sache und nicht zwei: Platz 1 steht oben, mit dem, was dort schon geregelt
   ist und was noch offen.

   Bereiche mit einer Wunsch-Torfrage zaehlen nur mit, wenn er sie bejaht -
   niemand bekommt Abzug dafuer, etwas nicht zu wollen. Absicherung und
   Subventionen fragen einen Zustand ab; dort ist ein "Nein" eine echte
   Luecke und zaehlt. */
/* Nicht jede Frage wiegt gleich schwer: Ob jemand abgesichert ist, zählt
   mehr als die Frage nach dem Online-Banking. Die Gewichte (gew) stehen
   je Kriterium und werden am Ende auf 1.000 normiert - so bleibt die Skala
   gleich, auch wenn ein ganzer Bereich nicht zutrifft. */
const DNA_SKALA = 1000;
const DNA_BEREICHE = [
  { key:"rente", label:"Feierabend", farbe:"#2563eb", wunsch:true, kriterien:[
    { gew:30, text:"Du weißt, was du aus der gesetzlichen Rente erwarten kannst", ok:()=>state.renteBeruehrt===true },
    { gew:55, text:"Du hast bereits einen Teil der Rentenlücke geschlossen",      ok:()=>state.lueckeBeruehrt===true && Number(state.lueckeGeschlossen)>0 },
    { gew:45, text:"Mehr als die Hälfte der Lücke ist geschlossen",               ok:()=>Number(state.lueckeGeschlossen)>=50 }
  ]},
  { key:"familie", label:"Perspektiven für die Kinder", farbe:"#7c3aed", wunsch:true, kriterien:[
    { gew:25, text:"Du hast festgelegt, wie viel vom Kindergeld du anlegen willst", ok:()=>!!state.kindergeldAnteil },
    { gew:55, text:"Du legst schon etwas für deine Kinder an",                      ok:()=>!!String(state.kinderBisher||"").trim() },
    { gew:30, text:"Du legst mindestens die Hälfte des Kindergeldes an",            ok:()=>Number(state.kindergeldAnteil)>=50 }
  ]},
  { key:"vermoegen", label:"Ertrag", farbe:"#d97706", wunsch:true, kriterien:[
    { gew:15, text:"Du erledigst deine Bankgeschäfte online",         ok:()=>state.onlineBanking===true },
    { gew:30, text:"Dein Konto kostet dich keine Gebühren",           ok:()=>state.kontoGebuehren==="ohne" },
    { gew:40, text:"Du weißt, welche Rendite dein Geld heute bringt", ok:()=>state.renditeBekannt==="ja" },
    /* Das eigentliche Kriterium des Bereichs: arbeitet das Geld oder liegt es? */
    { gew:70, text:"Dein Geld arbeitet – es liegt nicht nur herum",   ok:()=>anlagenArbeiten()>0 },
    { gew:35, text:"Du verteilst auf mehr als eine Anlage",           ok:()=>anlagenGestreut()>=2 },
    { gew:40, text:"Du hast ein Rücklagenkonto",                      ok:()=>state.ruecklage==="unter" || state.ruecklage==="ueber" }
  ]},
  { key:"eigentum", label:"Mietfrei wohnen", farbe:"#16a34a", wunsch:true, kriterien:[
    { gew:45, text:"Ein Grundstück ist vorhanden oder in Aussicht", ok:()=>state.grundstueck==="ja" || state.grundstueck==="aussicht" },
    { gew:30, text:"Du hast einen Zeitpunkt im Blick",              ok:()=>!!state.bauZeit && state.bauZeit!=="offen" },
    { gew:25, text:"Du kennst die Vorzüge eines Tilgungskontos",    ok:()=>state.tilgungskonto===true }
  ]},
  { key:"steuern", label:"Anspruch auf Subventionen", farbe:"#0891b2", wunsch:false, kriterien:[
    { gew:70, text:"Du nutzt bereits staatliche Förderung", ok:()=>state.gate.steuern===true },
    { gew:40, text:"Du weißt genau, welche Förderung das ist",
      ok:()=>Array.isArray(state.subvGenutzt) && state.subvGenutzt.filter(x=>x!=="Weiß ich nicht genau").length>0 }
  ]},
  { key:"absicherung", label:"Absicherung", farbe:"#0d9488", wunsch:false, kriterien:[
    { gew:65, text:"Dein Einkommen ist abgesichert, wenn du länger ausfällst", ok:()=>state.gate.absicherung===true },
    { gew:25, text:"Du weißt, was nach dem Krankengeld noch reinkommt",       ok:()=>state.absBeruehrt===true },
    { gew:55, text:"Auch danach bliebe mindestens die Hälfte deines Einkommens", ok:()=>Number(state.absProzent)>=50 },
    { gew:35, text:"Auch danach blieben mehr als drei Viertel",                ok:()=>Number(state.absProzent)>=75 },
    { gew:40, text:"Auch das Einkommen deiner Partnerin oder deines Partners ist abgesichert",
      gilt:()=>state.haushalt==="paar", ok:()=>state.absVorhandenPartner===true }
  ]}
];

/* Rente, Ertrag, Eigentum, Absicherung und Förderung betreffen jeden - auch
   den, der bei der Torfrage "Nein" gesagt hat. Nur die Kinder sind eine echte
   Ausnahme: Wer keine hat, kann dort nichts erreichen. */
function dnaBereichAktiv(b){
  if(b.key==="familie") return !(state.gate.familie===false && state.kinderVorhanden===false);
  return true;
}
function dnaBereiche(){
  return DNA_BEREICHE
    .filter(dnaBereichAktiv)
    .map(b=>{
      const krit=b.kriterien.filter(k=>!k.gilt || k.gilt()).map(k=>({ text:k.text, gew:k.gew, ok:!!k.ok() }));
      const erreicht=krit.filter(k=>k.ok).length;
      const gewMax=krit.reduce((x,k)=>x+k.gew,0);
      const gewIst=krit.reduce((x,k)=>x+(k.ok?k.gew:0),0);
      const stand = gewMax ? Math.round(gewIst/gewMax*100) : 0;
      return { key:b.key, label:b.label, farbe:b.farbe, kriterien:krit,
               platz:state.rang[b.key]||null, kurz:blockKurz(b.key),
               erreicht:erreicht, max:krit.length,
               gewIst:gewIst, gewMax:gewMax, stand:stand, handlung:false };
    })
    /* Seine Rangfolge ist die Reihenfolge - Absicherung hat keinen Platz und
       rutscht damit ans Ende. */
    .sort((a,b)=>(a.platz||99)-(b.platz||99));
}
/* Genau EIN Hebel, nicht mehrere: wo ein wichtiges Ziel auf einen niedrigen
   Stand trifft, ist der Ansatz am größten. Wichtigkeit mal Lücke - dieselbe
   Rechnung, mit der das Werkzeug von Anfang an gearbeitet hat. */
function dnaMitHebel(){
  const bs=dnaBereiche();
  let best=null, wert=0;
  bs.forEach(b=>{
    if(!b.platz || b.stand>=100) return;
    const w=(7-b.platz)*(100-b.stand);
    if(w>wert){ wert=w; best=b; }
  });
  if(best) best.handlung=true;
  return bs;
}
/* Fünf Stufen. Sie ordnen die Zahl ein, ohne etwas über andere Menschen zu
   behaupten - dafür fehlen uns schlicht die Daten. Sobald genug Expertisen
   erfasst sind, ließe sich hier die echte Verteilung einsetzen. */
const DNA_STUFEN = [
  { ab:  0, name:"Startlinie",      satz:"Der Anfang ist gemacht: Du weißt jetzt, was dir wichtig ist." },
  { ab:200, name:"Grundlagen",      satz:"Erste Bausteine stehen – der Rest wartet noch." },
  { ab:400, name:"Im Aufbau",       satz:"Du hast einiges angepackt, an mehreren Stellen fehlt noch etwas." },
  { ab:600, name:"Gut aufgestellt", satz:"Das meiste läuft. Jetzt geht es um die Feinheiten." },
  { ab:800, name:"Rundum geregelt", satz:"Kaum noch Lücken – hier geht es ums Optimieren." }
];
function dnaStufe(wert){
  let st=DNA_STUFEN[0];
  DNA_STUFEN.forEach(x=>{ if(wert>=x.ab) st=x; });
  return { stufe:st, nummer:DNA_STUFEN.indexOf(st)+1, gesamt:DNA_STUFEN.length };
}
function dnaPunkte(){
  const bs=dnaBereiche();
  const erreicht=bs.reduce((x,b)=>x+b.erreicht,0);
  const max=bs.reduce((x,b)=>x+b.max,0);
  const gIst=bs.reduce((x,b)=>x+b.gewIst,0);
  const gMax=bs.reduce((x,b)=>x+b.gewMax,0);
  const anteil = gMax ? Math.round(gIst/gMax*100) : 0;
  const wert = Math.round(anteil/100*DNA_SKALA);
  const st=dnaStufe(wert);
  return { erreicht:erreicht, max:max, offen:max-erreicht,
           anteil:anteil, wert:wert, skala:DNA_SKALA,
           stufe:st.stufe, stufeNr:st.nummer, stufen:st.gesamt };
}
/* Ein Satz, der die Zahl liest - ohne ihr etwas hinzuzufuegen. */
function dnaSatz(){
  const p=dnaPunkte();
  if(!p.max) return "";
  return p.stufe.satz+" "+(p.offen===0
    ? "Alle Punkte deiner Expertise sind erfüllt."
    : p.offen+(p.offen===1?" Punkt steht":" Punkte stehen")+" noch offen – die nehmen wir uns im Termin vor.");
}

/* ---- Prioritäten als echte Rangfolge (wie im Papier: je Spalte ein Kreuz) ---- */
const PRIO_ZIELE = [
  ["rente","Rente auf Nettolohn-Niveau"],
  ["familie","Zukunft der Kinder sichern"],
  ["vermoegen","Attraktive Vermehrung des Kapitals"],
  ["eigentum","Mietfrei wohnen"],
  ["steuern","Staatliche Zuschüsse"],
];
/* Ein Ziel, das nicht zutrifft, wird auch nicht priorisiert - sonst müsste
   jemand ohne Kinder einen Platz für die Zukunft seiner Kinder vergeben. */
function aktivePrioZiele(){
  return PRIO_ZIELE.filter(z=>!(z[0]==="familie" && state.gate.familie===false && state.kinderVorhanden===false));
}
function rangVollstaendig(){ return aktivePrioZiele().every(z=>state.rang[z[0]]); }
function setzeRang(key, platz){
  /* Jeder Platz darf nur einmal vergeben sein – wer ihn hatte, wird frei. */
  Object.keys(state.rang).forEach(k=>{ if(state.rang[k]===platz) state.rang[k]=null; });
  state.rang[key] = (state.rang[key]===platz) ? null : platz;
  /* Rang in die Gewichtung übersetzen: Platz 1 = höchste Priorität */
  PRIO_ZIELE.forEach(z=>{ const r=state.rang[z[0]]; if(r) state.prio[z[0]] = 6-r; });
}

/* ---- Die einzelnen Blöcke ---- */

/* Was der Kunde schon gesagt hat, steht hier noch einmal - sichtbar
   übernommen, nicht neu erfragt. Der Bogen wirkt dadurch halb ausgefüllt,
   und die Einkommensfrage steht nicht mehr allein da. */
function bekanntKarte(){
  const zeilen=[];
  if(state.gate.familie===true && Number(state.kinder)>0){
    zeilen.push([Number(state.kinder)>1?"Kinder":"Kind",
      state.kinder+(Number(state.kinder)===1?" Kind":" Kinder")+" · "+kinderAlterText(), "familie"]);
  } else if(state.gate.familie===false){
    zeilen.push(["Kinder","kein Thema für dich","familie"]);
  }
  if(state.gate.eigentum===true) zeilen.push(["Wohnen","du willst mietfrei wohnen","eigentum"]);
  if(state.gate.rente===true) zeilen.push(["Ruhestand","Nettolohn-Niveau gewünscht","rente"]);
  if(anlageBudgetWert()>0) zeilen.push(["Monatlich möglich", eur(anlageBudgetWert()), "anlage"]);
  if(!zeilen.length) return null;

  const karte=h("div",{class:"card",style:"margin-top:4px;border-color:var(--p2-line);background:var(--p2-wash)"});
  karte.appendChild(h("div",{class:"sublabel",style:"color:var(--pulse)"},["Das wissen wir schon von dir"]));
  karte.appendChild(h("p",{style:"font-size:14px;color:var(--muted);line-height:1.45;margin:2px 0 8px"},["Aus deinen bisherigen Antworten übernommen – das fragen wir nicht noch einmal."]));
  zeilen.forEach(([k,v,ziel])=>{
    const aendern=h("span",{style:"cursor:pointer;color:var(--cloud);font-size:13px;font-weight:600;flex:0 0 auto"},["ändern"]);
    aendern.addEventListener("click",()=>{ state.offen=ziel; renderScreenKeepStep(); scrollZuBlock(ziel); });
    karte.appendChild(h("div",{class:"row"},[
      h("span",{class:"rl",style:"font-size:14.5px"},[k+": ", h("b",{style:"font-weight:600"},[v])]),
      aendern
    ]));
  });
  return karte;
}

function inhaltBasis(){
  const box=h("div");

function inhaltRente(){
  const box=h("div");
  box.appendChild(torfrage("Willst du einen finanziell abgesicherten Ruhestand auf Nettolohn-Niveau?","rente"));
  if(state.gate.rente!==true) return box;
  state.zielNiveau=100;
  const res=h("div");
  /* Der Notiert-Kasten muss den Reglern folgen - sonst steht dort ein Wert,
     den der Kunde gerade weggeschoben hat. */
  const notiert=h("div");
  const zeigeNotiert=()=>{
    notiert.innerHTML="";
    notiert.appendChild(notiertKasten([
      "Ziel: Ruhestand auf Nettolohn-Niveau, also 100 % vom heutigen Netto",
      (state.renteEingabe==="euro" && state.renteBeruehrt)
        ? ("Aus der gesetzlichen Rente rechnest du mit "+eur(state.renteEuro)+" im Monat")
        : ("Aus der gesetzlichen Rente rechnest du mit "+state.erwProzent+" % vom Netto"),
      state.lueckeBeruehrt ? ("Die Lücke hast du nach eigener Einschätzung zu "+state.lueckeGeschlossen+" % geschlossen – "+lueckeWort(state.lueckeGeschlossen)) : null
    ], "Was das für deinen Ruhestand bedeutet, rechnen wir im Termin mit deinen echten Unterlagen durch."));
  };
  const refresh=()=>{
    if(!state.beratungUnlocked){ zeigeNotiert(); return; }
    const c=calc();
    let s='<div class="rh">Deine Rentenlücke</div>';
    s+='<div style="text-align:center;margin:2px 0 12px"><div class="num" style="font-family:Space Grotesk;font-weight:700;font-size:38px;line-height:1.05;color:'+(c.renteLuecke>0?'var(--warn)':'var(--pulse)')+'">'+eur(c.renteLuecke)+'</div>'+
      '<div style="font-size:14px;color:var(--muted);margin-top:3px">'+(c.renteLuecke>0?'fehlen dir voraussichtlich jeden Monat':'Nach dieser groben Rechnung reicht es')+'</div></div>';
    s+=statRow("Jahre bis zur Rente",'<span class="num">'+c.jahreBisRente+'</span>');
    s+=statRow("Wunsch-Rente pro Monat (100 % vom Netto)",'<span class="num">'+eur(c.zielRente)+'</span>');
    s+=statRow("Davon voraussichtlich gesetzlich",'<span class="num">'+eur(c.gesetzl)+'</span>');
    s+=statRow("Grob nötiges Kapital bis dahin",'<span class="num">'+eurK(c.renteKapital)+'</span>');
    if(Number(state.vorhandenKapital)>0||Number(state.vorhandeneRente)>0) s+=statRow("Dein Kapital bis dahin",'<span class="num">'+eurK(c.kapitalZukunft)+'</span>');
    if(c.renteRest>0) s+=statRow("Zusätzlich nötiger Sparbeitrag",'<span class="num">'+eur(c.noetigerSparbeitrag)+'/Mon.</span>',true);
    s+='<p class="assume">Grobe Schätzung. Annahme: rund '+PAYOUT_YEARS+' Jahre Rentenbezug, vorhandenes Kapital und Sparbeitrag mit ~'+Math.round(RENTE_ZINS*100)+' % gerechnet. Keine Beratung.</p>';
    res.innerHTML=s;
  };
  box.appendChild(renteEingabeFeld(refresh));
  box.appendChild(lueckeFeld(refresh));
  /* Sparbeitrag und vorhandenes Kapital gehören nicht in die Aufnahme -
     der Bogen fragt sie nicht, und sie ziehen das Gespräch sofort in die
     Beratung. Für den Termin stehen sie hinter der Freigabe bereit. */
  if(state.beratungUnlocked){
    box.appendChild(slider("Monatlicher Sparbeitrag (aktuell)","vorhandeneRente",0,1500,50,v=>eur(v)+"/Mon.",refresh));
    box.appendChild(slider("Bereits vorhandenes Kapital","vorhandenKapital",0,200000,2500,v=>v>=200000?"200 Tsd. €+":eurK(v),refresh));
    refresh(); box.appendChild(res);
  }
  else { zeigeNotiert(); box.appendChild(notiert); }
  box.appendChild(weiterButton("rente"));
  return box;
}

    box.appendChild(ergebnisKasten(s));

  box.appendChild(weiterButton("vermoegen"));

/* Ab 1.1.2027 löst das Altersvorsorge-Reformgesetz die Riester-Rente ab.
   Bestehende Riester-Verträge behalten Bestandsschutz, neue Verträge heißen
   Altersvorsorgedepot bzw. Standarddepot. Beide Welten stehen deshalb in
   einer Zeile - der Kunde weiß meist nur, dass er "was Gefördertes" hat.
   Nutzt Bankshop intern das Wort "Förderrente", hier einfach austauschen. */
/* Steuerliche Eckwerte, an einer Stelle pflegbar. Stand: September 2026.
   Basisrente-Höchstbetrag folgt der knappschaftlichen Beitragsbemessungs-
   grenze und ändert sich jedes Jahr - hier jährlich nachziehen. */
const STEUER = {
  basisHoechst:      30826,   // Sonderausgaben-Höchstbetrag 2026, Ledige
  basisHoechstPaar:  61652,   // ... zusammenveranlagt
  gwgNetto:            800,   // geringwertiges Wirtschaftsgut: sofort absetzbar
  kmPauschale:        0.30,   // je gefahrenem Kilometer mit dem Privatwagen
  homeofficeTag:         6,   // je Arbeitstag zu Hause
  homeofficeMax:      1260    // ... höchstens im Jahr
};

/* Worin liegt das Geld? Das ist die Frage, aus der sich der Ertrag wirklich
   ablesen laesst - alles andere davor ist Beiwerk. */
const ANLAGEN_HEUTE = [
  ["etf",          "ETF oder Fonds"],
  ["gold",         "Gold oder Edelmetall"],
  ["versicherung", "Lebens- oder Rentenversicherung"],
  ["immobilie",    "Immobilie"],
  ["tagesgeld",    "Tages- oder Festgeld"],
  ["konto",        "Liegt auf dem Girokonto"],
  ["nichts",       "Nichts davon"]
];
/* Diese Formen arbeiten wirklich - Tagesgeld parkt nur, das Girokonto kostet. */
const ANLAGEN_ARBEITEND = ["etf","gold","versicherung","immobilie"];
function anlagenArbeiten(){
  return (state.anlagenHeute||[]).filter(x=>ANLAGEN_ARBEITEND.indexOf(x)>=0).length;
}
function anlagenGestreut(){
  return (state.anlagenHeute||[]).filter(x=>x!=="konto" && x!=="nichts").length;
}
function anlagenText(){
  const map={}; ANLAGEN_HEUTE.forEach(([k,l])=>map[k]=l);
  return (state.anlagenHeute||[]).map(k=>map[k]).join(", ");
}

const SUBVENTIONEN = ["Riester-Rente / Altersvorsorgedepot (ab 2027)","Betriebliche Altersvorsorge","Basisrente / Rürup","Wohnungsbauprämie","Arbeitnehmersparzulage (VL)","KfW-Förderung","Weiß ich nicht genau"];

  if(state.gate.steuern===null) return box;

  if(state.gate.steuern===true){
    box.appendChild(frageZeile("Welche nutzt du?"));
    box.appendChild(wahlReihe(SUBVENTIONEN.map(s=>[s,s]), v=>state.subvGenutzt.indexOf(v)>=0, v=>{
      const i=state.subvGenutzt.indexOf(v);
      if(i>=0) state.subvGenutzt.splice(i,1); else state.subvGenutzt.push(v);
    }));
    box.appendChild(h("p",{class:"assume",style:"margin-top:8px"},["Mehrfachauswahl möglich."]));
  } else {
    box.appendChild(h("p",{style:"font-size:14.5px;color:var(--muted);line-height:1.5;margin-top:14px"},["Dann liegt hier vermutlich am meisten ungenutzt. Gleich unten kannst du dir ansehen, was es überhaupt gibt."]));
  }

  box.appendChild(frageZeile("Möchtest du wissen, worauf du sonst noch Anspruch hättest?"));
  box.appendChild(wahlReihe([[true,"Ja, gerne"],[false,"Nein danke"]], v=>state.subvInfo===v, v=>{state.subvInfo=v;}, 2));

  /* Die Beispiele stehen hinter einer eigenen Tür: Wer sie nicht sehen will,
     wird nicht damit behelligt, und der Bogen bleibt kurz. */
  box.appendChild(frageZeile("Möchtest du praktische Beispiele kennenlernen?"));
  box.appendChild(wahlReihe([[true,"Ja, zeig mir das"],[false,"Nein danke"]], v=>state.beispiele===v, v=>{state.beispiele=v;}, 2));
  if(state.beispiele===true) box.appendChild(beispielBlock());

  box.appendChild(weiterButton("steuern"));
  return box;
}

/* Drei Wege, kompakt. Bewusst ohne ausgerechneten Steuervorteil: Was
   davon bei ihm ankommt, hängt an Dingen, die wir hier nicht erfragen -
   und es auszurechnen wäre Steuerberatung. Die Regel steht da, die Zahl
   entsteht im Termin. */
function beispielBlock(){

  const karte=(farbe,kopf,titel,zeilen,fuss)=>{
    const k=h("div",{class:"card",style:"border-color:"+farbe+"33"});
    k.appendChild(h("div",{class:"sublabel",style:"color:"+farbe},[kopf]));
    k.appendChild(h("div",{style:"font-family:Space Grotesk;font-weight:700;font-size:17px;color:var(--txt);margin-bottom:8px;line-height:1.25"},[titel]));
    zeilen.forEach(z=>{
      k.appendChild(h("div",{style:"display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line-soft)"},[
        h("div",{style:"flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:"+farbe+";margin-top:7px"}),
        h("div",{style:"flex:1;font-size:14px;color:var(--body);line-height:1.45"},[z])
      ]));
    });
    if(fuss) k.appendChild(h("p",{class:"assume",style:"margin-top:9px"},[fuss]));
    return k;
  };

  /* 1. Förderrente - hier steht ein echter Anspruch, keine Schätzung. */
  const a=foerderAnspruch();
  const foerder=karte("#0891b2","Neu ab "+FOERDER.ab,"Die neue Förderrente",[
    "Die Riester-Rente wird abgelöst. Ab "+FOERDER.ab+" gibt es das Altersvorsorgedepot mit direkter Zulage vom Staat.",
    (a.personen===2?"Bis zu "+eur(FOERDER.maxGrundzulage)+" Grundzulage je Person und Jahr – für euch beide "+eur(a.grund)+".":"Bis zu "+eur(FOERDER.maxGrundzulage)+" Grundzulage im Jahr."),
    (Number(state.kinder)>0 ? "Dazu "+eur(FOERDER.kinderzulage)+" je Kind und Jahr – bei "+state.kinder+(Number(state.kinder)===1?" Kind":" Kindern")+" also "+eur(a.kind)+"." : "Dazu "+eur(FOERDER.kinderzulage)+" je Kind und Jahr.")
  ],"Höchstbeträge nach dem Altersvorsorge-Reformgesetz. Die Kinderzulage gibt es je Kind einmal, auch wenn ihr zu zweit einzahlt. Die volle Zulage setzt einen eigenen Beitrag voraus.");
  foerder.appendChild(h("div",{style:"text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)"},[
    h("div",{class:"num",style:"font-family:Space Grotesk;font-weight:700;font-size:32px;line-height:1.05;color:#0891b2"},[eur(a.gesamt)]),
    h("div",{style:"font-size:13px;color:var(--muted);margin-top:2px"},["stünden dir pro Jahr zu"])
  ]));
  box.appendChild(foerder);

  /* 2. Basisrente - die Regel, ohne den Höchstbetrag zur Verheißung zu machen. */
  box.appendChild(karte("#2563eb","§ 10 EStG","Basisrente (Rürup)",[
    "Beiträge sind zu 100 % als Sonderausgaben absetzbar.",
    "Der Höchstbetrag liegt "+new Date().getFullYear()+" bei "+eur(STEUER.basisHoechst)+" im Jahr, zusammenveranlagt bei "+eur(STEUER.basisHoechstPaar)+".",
    "Interessant vor allem bei hohem Einkommen und für Selbstständige, die keine gesetzliche Rente aufbauen."
  ],"Bei Angestellten ist ein großer Teil des Höchstbetrags schon durch die gesetzliche Rentenversicherung belegt; der Arbeitgeberanteil zählt nicht mit. Was am Ende übrig bleibt, rechnen wir im Termin gemeinsam aus."));

  /* 3. Zweiteinkommen - der Hebel, an dem die Firma selbst hängt. */
  /* Der Bezug auf uns gehört ausdrücklich hin: Das Zweiteinkommen ist kein
     allgemeiner Steuertipp, sondern unser Angebot. */
  const neben=karte("#d97706","Zweites Standbein bei uns","Aus privaten Anschaffungen werden Betriebsausgaben",[
    "Als Einsatzvertreter bei uns wirst du nebenberuflich selbstständig – ohne eigene Zulassung.",
    "Und wer nebenberuflich selbstständig ist, setzt ab, was er für diese Tätigkeit braucht.",
    "Notebook, Tablet oder Smartphone bis "+eur(STEUER.gwgNetto)+" netto sofort im Jahr der Anschaffung, Teureres über die Nutzungsdauer.",
    "Fahrten mit dem eigenen Auto mit "+STEUER.kmPauschale.toFixed(2).replace(".",",")+" € je Kilometer – oder gleich ein Firmenwagen über unseren Großhandelsrabatt.",
    "Arbeiten zu Hause mit "+STEUER.homeofficeTag+" € je Tag, höchstens "+eur(STEUER.homeofficeMax)+" im Jahr."
  ],"Voraussetzung ist eine echte Tätigkeit mit Gewinnerzielungsabsicht. Wer dauerhaft nur Verluste schreibt, dem streicht das Finanzamt den Abzug als Liebhaberei. Allgemeine Information, keine Steuerberatung.");
  const carBox=h("div",{style:"cursor:pointer;background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:12px;padding:12px;text-align:center;margin-top:11px"},[
    h("div",{style:"font-family:Space Grotesk;font-weight:700;font-size:18px;color:var(--gold)"},["Dein Auto: ab ~"+eur(minAutoRate())+" / Monat"]),
    h("div",{style:"font-size:12.5px;color:var(--body);margin-top:3px"},["Großhandelsrabatt + Absetzbarkeit · tippen für Details →"])
  ]);
  carBox.addEventListener("click",()=>go("auto"));
  neben.appendChild(carBox);
  box.appendChild(neben);

  return box;
}

/* Der Ablauf, wie er wirklich ist - an einer Stelle pflegbar.
   Stand September 2026. */
const ABS_PHASEN = {
  lohnWochen:      6,     // Entgeltfortzahlung durch den Arbeitgeber, § 3 EFZG
  krankenWochen:  78,     // Krankengeld insgesamt, die 6 Wochen zählen mit
  krankenBrutto:  70,     // % vom Bruttoentgelt ...
  krankenNettoMax:90      // ... höchstens aber so viel vom Netto
};

/* Drei Stufen auf einer Grundlinie. Die ersten beiden sind gesetzlich
   vorgegeben, die dritte ist seine eigene Angabe - und genau dort bricht
   die Kurve ein. Nichts davon ist auf sein Einkommen gerechnet. */
function absicherungBild(){
  const eigen = Math.max(0, Math.min(100, Number(state.absProzent)||0));
  const P=ABS_PHASEN;
  const H=118;   // Höhe der Zeichenfläche

  const saeule=(anteil, breite, farbe, kopf, unten, schraffur)=>{
    const hoehe=Math.round(H*anteil/100);
    const spalte=h("div",{style:"flex:"+breite+";min-width:0;display:flex;flex-direction:column;justify-content:flex-end"});
    spalte.appendChild(h("div",{style:"font-family:Space Grotesk;font-weight:800;font-size:13.5px;color:"+farbe+";text-align:center;margin-bottom:4px"},[kopf]));
    /* Der fehlende Teil steht schraffiert über dem vollen - so sieht man die
       Lücke, statt sie sich denken zu müssen. */
    if(schraffur && anteil<100){
      spalte.appendChild(h("div",{style:"height:"+(H-hoehe)+"px;border-radius:7px 7px 0 0;border:1px dashed var(--gold-line);border-bottom:none;"+
        "background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--gold-tint) 5px,var(--gold-tint) 10px)"}));
    }
    spalte.appendChild(h("div",{style:"height:"+Math.max(hoehe,4)+"px;border-radius:"+(schraffur&&anteil<100?"0 0 7px 7px":"7px")+";background:"+farbe}));
    /* Zwei getrennte Zeilen: der Zeitraum fett, die Erklaerung darunter.
       Ein "\n" im Text bricht in HTML nicht um. */
    spalte.appendChild(h("div",{style:"text-align:center;margin-top:7px;min-height:42px"},[
      h("div",{style:"font-size:11.5px;font-weight:800;color:var(--txt);line-height:1.2"},[unten[0]]),
      h("div",{style:"font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px"},[unten[1]])
    ]));
    return spalte;
  };

  const wrap=h("div",{style:"margin-top:14px"});
  wrap.appendChild(h("div",{style:"display:flex;gap:7px;align-items:flex-end"},[
    saeule(100, 22, "#16a34a", "100 %", ["Woche 1–"+P.lohnWochen, "Arbeitgeber zahlt weiter"], false),
    saeule(80,  34, "#0d9488", P.krankenBrutto+"–"+P.krankenNettoMax+" %", ["bis Woche "+P.krankenWochen, "Krankengeld von der Kasse"], false),
    saeule(eigen, 44, eigen>=50?"#16a34a":"var(--gold)", eigen+" %", ["danach", "nur noch, was du selbst hast"], true)
  ]));

  wrap.appendChild(h("p",{style:"font-size:13.5px;color:var(--body);line-height:1.5;margin:14px 0 0"},[
    eigen>=100
      ? "Nach deiner Einschätzung würde auch nach dem Krankengeld alles weiterlaufen."
      : "Nach rund anderthalb Jahren ist das Krankengeld aufgebraucht. Ab da fehlen dir nach deiner Einschätzung "+(100-eigen)+" % deines Einkommens – Monat für Monat."
  ]));
  if(state.selbststaendig==="haupt"){
    wrap.appendChild(h("p",{style:"font-size:13px;color:var(--gold);line-height:1.45;margin:8px 0 0;font-weight:600"},
      ["Als Selbstständige:r entfällt die Lohnfortzahlung – bei dir zählt ab dem ersten Tag nur, was du selbst abgesichert hast."]));
  }
  wrap.appendChild(h("p",{class:"assume",style:"margin-top:10px"},
    ["Sechs Wochen Entgeltfortzahlung nach § 3 EFZG. Krankengeld: "+P.krankenBrutto+" % vom Brutto, höchstens "+P.krankenNettoMax+" % vom Netto – davon gehen noch Beiträge zur Renten-, Arbeitslosen- und Pflegeversicherung ab. Höchstens "+P.krankenWochen+" Wochen innerhalb von drei Jahren wegen derselben Krankheit, die ersten sechs Wochen zählen mit. Eine Erwerbsminderungsrente gibt es nur unter engen Voraussetzungen und nicht automatisch. Was in deinem Fall gilt, sehen wir uns im Termin an."]));
  return wrap;
}

function inhaltAbsicherung(){
  const box=h("div");
  box.appendChild(torfrage("Ist dein Einkommen abgesichert, wenn du länger ausfällst?","absicherung"));
  if(state.gate.absicherung===null) return box;
  state.absVorhanden = state.gate.absicherung===true;

  /* Der Haushalt gehört inhaltlich hierher: Ob ein oder zwei Einkommen
     abzusichern sind, ist genau die Frage dieses Blocks. */
  box.appendChild(frageZeile("Lebst du allein oder mit Partner:in?"));
  box.appendChild(wahlReihe([["allein","Ich allein"],["paar","Wir zu zweit"]],
    v=>state.haushalt===v, v=>{ state.haushalt=v; }, 2));
  const paar=state.haushalt==="paar";
  if(paar && state.gate.absicherung===true){
    box.appendChild(frageZeile("Gilt das für beide?"));
    box.appendChild(wahlReihe([[true,"Ja, für beide"],[false,"Nur für eine:n"]], v=>state.absVorhandenPartner===v, v=>{state.absVorhandenPartner=v;}, 2));
  }

  /* Die eigentliche Frage des Blocks. Fast jeder sagt "ja, hab ich was" -
     erst der Anteil zeigt, ob es reicht. Das Bild folgt dem Regler sofort. */
  /* Erst der Ablauf, dann die Frage. Wer weiß, dass nach anderthalb Jahren
     Schluss ist, beantwortet sie anders. */
  box.appendChild(frageZeile("Angenommen, du kannst längere Zeit nicht arbeiten:"));
  box.appendChild(h("div",{style:"font-size:14px;color:var(--muted);line-height:1.55;margin:-4px 0 4px"},[
    "Sechs Wochen zahlt dein Arbeitgeber deinen Lohn voll weiter. Danach springt die Krankenkasse ein – höchstens anderthalb Jahre lang. Und dann?"
  ]));
  const bild=h("div");
  const zeigeBild=()=>{ bild.innerHTML=""; bild.appendChild(absicherungBild()); };
  box.appendChild(slider("Danach kämen noch rein","absProzent",0,100,5,v=>v+" % deines Einkommens",()=>{ state.absBeruehrt=true; zeigeBild(); }));
  zeigeBild();
  box.appendChild(bild);
  if(state.beratungUnlocked){
    const c=calc();
    let s='<div class="rh">Dein wichtigstes Kapital: du selbst</div>';
    s+=statRow(paar?"Wert eurer Arbeitskraft bis zur Rente":"Wert deiner Arbeitskraft bis zur Rente",'<span class="num">'+eurK(c.arbeitskraft)+'</span>');
    s+='<p class="assume">'+(state.gate.absicherung===true
        ? "Gut – ob die Höhe zur Lücke passt, schauen wir uns im Termin an."
        : "Ohne Absicherung steht dieser ganze Wert auf dem Spiel. Risikohinweis, kein Verkauf.")+'</p>';
    box.appendChild(ergebnisKasten(s));
  } else {
    box.appendChild(notiertKasten([
      state.gate.absicherung===true
        ? ("Absicherung vorhanden"+(paar?(state.absVorhandenPartner===false?" – bisher nur für eine Person":" – für beide"):""))
        : "Bisher keine Absicherung des Einkommens",
      "Nach dem Krankengeld kämen nach deiner Einschätzung noch "+state.absProzent+" % deines Einkommens rein"+
        (Number(state.absProzent)<100 ? (" – "+(100-Number(state.absProzent))+" % fehlen dann") : "")
    ], state.gate.absicherung===true
        ? "Ob die Höhe zu deiner Situation passt, schauen wir uns im Termin an."
        : "Was das im Ernstfall bedeutet, besprechen wir im Termin in Ruhe."));
  }
  box.appendChild(fachmannFrage("absFachmann",
    "Soll sich das ein Fachmann genauer ansehen?",
    "Absicherung ist ein eigenes Fachgebiet. Wenn du magst, nimmt sich dafür im Termin ein Spezialist gesondert Zeit."));
  box.appendChild(weiterButton("absicherung"));
  return box;
}

function inhaltPrio(){

  box.appendChild(h("p",{style:"font-size:14px;color:var(--muted);line-height:1.45;margin:0 0 16px"},["Platz 1 ist dir am wichtigsten. Jeder Platz wird genau einmal vergeben – wie auf dem Bogen."]));
  if(aktivePrioZiele().length<PRIO_ZIELE.length) box.appendChild(h("p",{class:"assume",style:"margin:-10px 0 12px"},["Die Zukunft der Kinder lassen wir weg – das trifft bei dir nicht zu."]));

      b.addEventListener("click",()=>{ setzeRang(key,p); renderScreenKeepStep(); });

    [offen? ("Noch "+offen+" "+(offen===1?"Ziel":"Ziele")+" ohne Platz") : "Rangfolge vollständig ✓"]));
  /* Weiter zur Ausgangslage - erst wenn alle fünf Plätze vergeben sind. */
  const w=weiterButton("prio");
  w.disabled=!rangVollstaendig();

/* ===== Anlagestrategie: genau zwei Kriterien, Laufzeit, Budget =====
   Der Bogen fragt "Welche 2 Kriterien" - also lassen wir auch genau zwei zu.
   Wer ein drittes antippt, verdrängt das älteste; so bleibt niemand hängen. */
const ANLAGE_KRITERIEN = [
  ["steuervorteile","Steuervorteile"],
  ["verfuegbarkeit","Verfügbarkeit"],
  ["inflationsschutz","Inflationsschutz"],
  ["werthaltigkeit","Werthaltigkeit"],
  ["wachstum","Wachstum"],
  ["chance","Chance"],
];
const ANLAGE_LAUFZEITEN = [1,3,5,10,15,20,25,30,35];
const ANLAGE_BUDGETS = [100,150,200];

function kriteriumLabel(k){ const f=ANLAGE_KRITERIEN.find(x=>x[0]===k); return f?f[1]:k; }
function anlageKriterienText(){ return state.anlageKriterien.map(kriteriumLabel).join(" und "); }

function inhaltAnlage(){
  const box=h("div");
  box.appendChild(h("p",{style:"font-size:15px;color:var(--txt);line-height:1.45;margin:0 0 4px"},["Welche zwei Kriterien sind dir in deiner persönlichen Anlagestrategie wichtig?"]));
  box.appendChild(h("p",{style:"font-size:14px;color:var(--muted);line-height:1.45;margin:0 0 12px"},["Genau zwei – tippst du ein drittes an, rückt das erste heraus."]));

  const grid=h("div",{class:"choices two"});
  ANLAGE_KRITERIEN.forEach(([k,l])=>{
    const on=state.anlageKriterien.indexOf(k)>=0;
    const b=h("button",{class:"chip"+(on?" sel":""),style:"text-align:center"},[l]);
    b.addEventListener("click",()=>{
      const i=state.anlageKriterien.indexOf(k);
      if(i>=0) state.anlageKriterien.splice(i,1);
      else { state.anlageKriterien.push(k); if(state.anlageKriterien.length>2) state.anlageKriterien.shift(); }
      renderScreenKeepStep();
    });
    grid.appendChild(b);
  });
  box.appendChild(grid);
  const offen=2-state.anlageKriterien.length;
  box.appendChild(h("p",{style:"text-align:center;font-family:Space Grotesk;font-weight:600;font-size:14px;color:"+(offen>0?"var(--muted)":"var(--pulse)")+";margin-top:10px"},
    [offen>0 ? ("Noch "+offen+(offen===1?" Kriterium":" Kriterien")+" wählen") : ("Gewählt: "+anlageKriterienText())]));

  /* Laufzeit auf der Skala des Bogens: 1 bis 35 Jahre */
  box.appendChild(frageZeile("In welcher Laufzeit?"));
  const lz=h("span",{class:"val"});
  const setLz=()=>lz.textContent = state.anlageLaufzeit!==null ? (ANLAGE_LAUFZEITEN[state.anlageLaufzeit]+" Jahre") : "–";
  setLz();
  const lzIn=h("input",{type:"range",min:0,max:ANLAGE_LAUFZEITEN.length-1,step:1});
  lzIn.value = state.anlageLaufzeit!==null ? state.anlageLaufzeit : 3;
  lzIn.addEventListener("input",()=>{ state.anlageLaufzeit=Number(lzIn.value); setLz(); });
  box.appendChild(h("div",{class:"field",style:"margin-top:6px"},[
    h("div",{class:"lab"},[ h("span",null,["Anlagedauer"]), lz ]), lzIn,
    h("div",{style:"display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px"},
      [h("span",null,["1 Jahr"]),h("span",null,["10"]),h("span",null,["20"]),h("span",null,["35 Jahre"])])
  ]));
  if(state.anlageLaufzeit===null) box.appendChild(h("p",{class:"assume",style:"margin-top:-8px"},["Schieb den Regler auf deine Wunschdauer."]));

  /* Budget: die drei Stufen des Bogens plus freier Betrag */
  box.appendChild(frageZeile("Welches Budget möchtest du dafür zusätzlich investieren?"));
  const bgrid=h("div",{class:"choices two"});
  ANLAGE_BUDGETS.forEach(v=>{
    const on=state.anlageBudget===v;
    const b=h("button",{class:"chip"+(on?" sel":""),style:"text-align:center"},[eur(v)]);
    b.addEventListener("click",()=>{ state.anlageBudget=v; state.anlageBudgetFrei=""; uebernehmeBudget(); renderScreenKeepStep(); });
    bgrid.appendChild(b);
  });
  const frei=h("button",{class:"chip"+(state.anlageBudget==="frei"?" sel":""),style:"text-align:center"},["Anderer Betrag"]);
  frei.addEventListener("click",()=>{ state.anlageBudget="frei"; renderScreenKeepStep(); });
  bgrid.appendChild(frei);
  box.appendChild(bgrid);
  if(state.anlageBudget==="frei"){
    const inp=h("input",{type:"tel",placeholder:"Betrag in Euro pro Monat",value:state.anlageBudgetFrei||"",style:"margin-top:10px"});
    inp.addEventListener("input",()=>{ state.anlageBudgetFrei=inp.value.replace(/[^0-9]/g,""); uebernehmeBudget(); });
    box.appendChild(inp);
  }

  box.appendChild(notiertKasten([
    state.anlageKriterien.length===2 ? ("Wichtig sind dir "+anlageKriterienText()) : null,
    state.anlageLaufzeit!==null ? ("Anlagedauer: "+ANLAGE_LAUFZEITEN[state.anlageLaufzeit]+" Jahre") : null,
    anlageBudgetWert()>0 ? ("Zusätzlich möglich: "+eur(anlageBudgetWert())+" im Monat") : null
  ], "Welche Bausteine dazu passen, besprechen wir im Termin."));

  box.appendChild(weiterButton("anlage"));
  return box;
}

/* Der genannte Betrag ist zugleich das Budget, mit dem die Auswertung rechnet. */
function anlageBudgetWert(){
  if(state.anlageBudget==="frei") return Number(state.anlageBudgetFrei||0);
  return Number(state.anlageBudget||0);
}
function uebernehmeBudget(){
  const v=anlageBudgetWert();
  if(v>0){ state.freiBudget=v; state.budgetPreset=true; }
}

const BLOCK_DEF = {
  basis:        {nr:0, titel:"Deine Ausgangslage",              inhalt:inhaltBasis},
  rente:        {nr:1, titel:"Feierabend",                       inhalt:inhaltRente},
  familie:      {nr:2, titel:"Perspektiven für deine Kinder",    inhalt:inhaltFamilie},
  vermoegen:    {nr:3, titel:"Ertrag",                           inhalt:inhaltVermoegen},
  eigentum:     {nr:4, titel:"Mietfrei wohnen",                  inhalt:inhaltEigentum},
  steuern:      {nr:5, titel:"Dein Anspruch auf Subventionen",   inhalt:inhaltSteuern},
  absicherung:  {nr:6, titel:"Absicherung",                      inhalt:inhaltAbsicherung},
  prio:         {nr:7, titel:"Deine Prioritäten",                inhalt:inhaltPrio},
  anlage:       {nr:8, titel:"Deine Anlagestrategie",            inhalt:inhaltAnlage},
};

function screenAufnahme(){
  const kids=[
    h("div",{class:"eyebrow"},["Deine Expertise"]),
    h("h2",{style:"font-size:27px"},["Erst deine Ziele, dann die Zahlen"]),
    h("p",{class:"lead",style:"margin-bottom:20px"},["Jeder Block beginnt mit einer einfachen Ja-oder-Nein-Frage. Nur was dich betrifft, wird geöffnet – der Rest bleibt zu. Nach Alter und Einkommen fragen wir ganz zum Schluss."])
  ];
  let nr=0;
  BLOCK_ORDER.forEach(id=>{
    if(!blockSichtbar(id)) return;
    nr++;
    const d=BLOCK_DEF[id];
    kids.push(blockKarte(id, nr, d.titel, blockFertig(id), blockKurz(id), d.inhalt));
  });
  const alleFertig = BLOCK_ORDER.filter(blockSichtbar).every(blockFertig);
  /* Der Abschluss der Aufnahme führt direkt weiter - je nach Variante in die
     FinanzCloud oder zu den Chancen. */
  const naechster = steps()[Math.min(steps().length-1, idx()+1)];
  const beschriftung = ({cloud:"Weiter zur FinanzCloud", termin:"Weiter zum Termin"})[naechster] || "Weiter";
  const fertigBtn=h("button",{class:"btn",style:"margin-top:16px"},[beschriftung]);
  fertigBtn.disabled=!alleFertig;
  fertigBtn.addEventListener("click",()=>next());
  kids.push(fertigBtn);
  if(!alleFertig) kids.push(h("p",{class:"foot"},["Offene Blöcke sind oben grau markiert – tipp einen an, um ihn zu öffnen."]));
  kids.push(loadControl({mt:16}));
  return h("div",{class:"screen"},kids);
}


function currentScreen(){
  switch(state.step){
    case "admin": return screenAdmin();
    case "intro": return screenIntro();
    case "aufnahme": return screenAufnahme();
    case "typ": return screenTyp();
    case "basis": return screenBasis();
    case "rente": return screenRente();
    case "eigentum": return screenEigentum();
    case "vermoegen": return screenVermoegen();
    case "invest": return screenInvest();
    case "familie": return screenFamilie();
    case "absicherung": return screenAbsicherung();
    case "auto": return screenAuto();
    case "partner": return screenPartner();
    case "lead": return screenLead();
    case "expertise": return screenExpertise();
    case "cloud": return screenCloud();
    case "termin": return screenTermin();
    case "empfehlung": return screenEmpfehlung();
    default: return screenIntro();
  }
}
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(state.step!=="intro" && state.step!=="admin") app.appendChild(header());
  app.appendChild(currentScreen());
  if(state.partner && state.step!=="admin" && state.step!=="intro"){
    const p=state.partner;
    const line="Dein Ansprechpartner: "+(p.name||"")+(p.tel?" · "+p.tel:"")+(p.email?" · "+p.email:"");
    app.appendChild(h("div",{style:"max-width:520px;margin:4px auto 0;text-align:center;font-size:12px;color:var(--faint);padding:0 20px 16px"},[line]));
  }
}
/* Neu rendern, ohne den Schritt zu wechseln. Auf der langen Aufnahme-Seite
   muss dabei die Scrollposition erhalten bleiben, sonst springt es bei jedem Klick. */
function renderScreenKeepStep(){ const y=window.scrollY||window.pageYOffset||0; render(); window.scrollTo(0,y); }

initFromUrl();
applyTheme();
render();
</script>
</body>
