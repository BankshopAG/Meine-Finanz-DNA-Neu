<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meine FinanzCloud</title>
<!--
  MEINE FINANZDNA — eigenständige Seite, einfach im Browser öffnen.
  Marke: Bankshop (Dachmarke) · Produkt "Meine FinanzDNA" -> führt in "Meine FinanzCloud".

  HINWEISE FÜR EURE PROGRAMMIERER
  - Alle Daten leben nur im Browser (Variable `state`). Keine Persistenz, kein Tracking.
  - Es werden bewusst nur grobe Angaben über Regler erfasst: kein exaktes Einkommen, keine Steuer-ID.
  - Datenübergabe: NUR die Funktion submitToSchnittstelle(payload). Hier eure echte
    Schnittstelle (CRM / FinanzCloud) anbinden. Aktuell nur simuliert (console.log).
  - KI-Auswertung: versucht die Anthropic-API; in PRODUKTION den Key NICHT ins Frontend
    legen, sondern über euer Backend proxen. Bei Fehler greift ein regelbasierter Fallback.
  - Bonusbeträge zentral in BONUS_CONFIG konfigurierbar.
  - Berechnungen bewusst einfach & transparent ("grobe Schätzung", Annahmen sichtbar). Keine Beratung.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

/* =========================================================
   FARBWELT – zwei Paletten, umschaltbar über den Kopf.
   Standard ist HELL mit der Hausfarbe Mitternachtsblau #12213D.
   Neue Farben bitte NUR hier ändern, nicht im Markup.
   ========================================================= */
:root{
  /* Leitfarben */
  --ink:#12213D;
  --cloud:#1a5cad;          /* Leitblau (Akzent, Buttons, Auswahl) */
  --pulse:#0e7c6b;          /* Ruhiges Petrol statt Neon-Türkis */
  --gold:#9a6c0c;           /* Gold als SCHRIFT – kontraststark */
  --gold-fill:#d99a1f;      /* Gold als Fläche/Balken */
  --on-accent:#ffffff;      /* Schrift auf Akzentfläche */
  --on-gold:#3a2600;        /* Schrift auf Goldfläche */

  /* Grund */
  --bg-a:#f6f9fc; --bg-b:#e9f0f8;
  --glow-1:rgba(26,92,173,.10); --glow-2:rgba(14,124,107,.08);
  --topfade-a:rgba(246,249,252,.97); --topfade-b:rgba(246,249,252,.55);

  /* Flächen */
  --surface:#ffffff;
  --surface-2:#f2f6fb;
  --surface-3:#f8fafd;
  --field:#ffffff;
  --thumb:#ffffff;
  --shadow:0 1px 2px rgba(18,33,61,.05), 0 6px 22px rgba(18,33,61,.07);

  /* Linien & Bahnen */
  --line:rgba(18,33,61,.17);
  --line-soft:rgba(18,33,61,.10);
  --track:rgba(18,33,61,.12);
  --track-2:rgba(18,33,61,.22);

  /* Schrift */
  --txt:#12213D;
  --body:#2c3d5d;
  --muted:#4f6386;
  --faint:#66779a;
  --disabled:#a7b3c6;

  /* Signal */
  --warn:#a84a12;
  --danger:#b02a37;

  /* Tönungen */
  --acc-wash:rgba(26,92,173,.06);
  --acc-tint:rgba(26,92,173,.12);
  --acc-line:rgba(26,92,173,.38);
  --p2-wash:rgba(14,124,107,.07);
  --p2-tint:rgba(14,124,107,.13);
  --p2-line:rgba(14,124,107,.38);
  --gold-wash:rgba(217,154,31,.11);
  --gold-tint:rgba(217,154,31,.20);
  --gold-line:rgba(217,154,31,.50);

  --btn-a:#1a5cad; --btn-b:#123f7d;   /* Hauptbutton: Hausblau */
}

/* ===== DUNKEL – Navy, ohne Neon, mit angehobenen Kontrasten ===== */
html[data-theme="dunkel"]{
  --ink:#0a142e;
  --cloud:#5aa9ef;
  --pulse:#4fc9b4;
  --gold:#f2c064;
  --gold-fill:#efb14a;
  --on-accent:#06122c;
  --on-gold:#3a2600;

  --bg-a:#0a142e; --bg-b:#0d1e46;
  --glow-1:rgba(90,169,239,.16); --glow-2:rgba(79,201,180,.12);
  --topfade-a:rgba(10,20,46,.96); --topfade-b:rgba(10,20,46,.55);

  --surface:rgba(255,255,255,.055);
  --surface-2:rgba(255,255,255,.04);
  --surface-3:rgba(255,255,255,.025);
  --field:rgba(255,255,255,.07);
  --thumb:#ffffff;
  --shadow:none;

  --line:rgba(255,255,255,.16);
  --line-soft:rgba(255,255,255,.09);
  --track:rgba(255,255,255,.14);
  --track-2:rgba(255,255,255,.22);

  --txt:#eef3fb;
  --body:#d3ddee;
  --muted:#a9bcd9;
  --faint:#8fa2c2;
  --disabled:#5a6d8e;

  --warn:#ffa87c;
  --danger:#ff8a8a;

  --acc-wash:rgba(90,169,239,.10);
  --acc-tint:rgba(90,169,239,.18);
  --acc-line:rgba(90,169,239,.45);
  --p2-wash:rgba(79,201,180,.10);
  --p2-tint:rgba(79,201,180,.16);
  --p2-line:rgba(79,201,180,.42);
  --gold-wash:rgba(239,177,74,.12);
  --gold-tint:rgba(239,177,74,.20);
  --gold-line:rgba(239,177,74,.45);

  --btn-a:#6fb6f2; --btn-b:#3f8fd8;
}

*{box-sizing:border-box;}
html{background:var(--bg-b);}
html,body{margin:0; min-height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--txt);
  -webkit-font-smoothing:antialiased;
  /* Grundfarbe zuerst, damit auf langen Seiten nie Weiss durchscheint */
  background-color:var(--bg-b);
  background-image:
    radial-gradient(120% 60% at 80% 0%, var(--glow-2), transparent 60%),
    radial-gradient(120% 60% at -10% 100%, var(--glow-1), transparent 55%),
    linear-gradient(180deg,var(--bg-a) 0%, var(--bg-b) 900px);
  background-repeat:no-repeat;
}
.wrap{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding:0 18px 32px;}
@media (min-width:860px){
  .wrap{max-width:700px; padding:0 28px 40px;}
  body{font-size:16px;}
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:700; line-height:1.12; letter-spacing:-.01em; margin:0; color:var(--txt);}
p{margin:0; color:var(--muted); line-height:1.55;}
.num{font-family:'Space Grotesk',sans-serif; font-variant-numeric:tabular-nums;}

/* Kopf / DNA-Strang */
.top{position:sticky; top:0; z-index:5; padding:16px 0 12px;
  background:linear-gradient(180deg,var(--topfade-a),var(--topfade-b) 70%,transparent); backdrop-filter:blur(6px);}
.brand{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.brand .logo{font-family:'Space Grotesk'; font-weight:700; font-size:16px; letter-spacing:.02em; color:var(--txt);}
.brand .logo b{color:var(--cloud);} .brand .logo i{font-style:normal; color:var(--pulse);}
.pts{font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; color:var(--pulse);
  background:var(--p2-wash); border:1px solid var(--p2-line); padding:5px 10px; border-radius:999px;}
.strand{display:flex; align-items:center; gap:6px;}
.seg{flex:1; height:4px; border-radius:99px; background:var(--track);}
.seg.on{background:linear-gradient(90deg,var(--cloud),var(--pulse));}
.node{width:10px; height:10px; border-radius:50%; background:var(--track-2); flex:0 0 auto; transition:all .4s;}
.node.on{background:var(--pulse); box-shadow:0 0 0 3px var(--p2-wash);}
.node.cur{background:var(--cloud); box-shadow:0 0 0 4px var(--acc-tint);}

/* Theme-Umschalter */
.themeSw{display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--surface-2);}
.themeSw button{font-family:'Inter'; font-size:11.5px; font-weight:600; border:0; cursor:pointer; padding:4px 10px; border-radius:999px; background:transparent; color:var(--muted);}
.themeSw button.on{background:var(--cloud); color:var(--on-accent);}

/* Screen */
.screen{flex:1; display:flex; flex-direction:column; justify-content:center; padding:8px 0 4px; animation:slideIn .45s cubic-bezier(.2,.7,.2,1);}
@keyframes slideIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
.eyebrow{font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--pulse); margin-bottom:10px;}
.lead{font-size:16px; color:var(--muted); margin-top:10px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; margin-top:16px; box-shadow:var(--shadow);}

/* Buttons */
.btn{font-family:'Space Grotesk'; font-weight:600; font-size:16.5px; border:0; cursor:pointer; width:100%;
  padding:15px 18px; border-radius:14px; color:var(--on-accent); background:linear-gradient(100deg,var(--btn-a),var(--btn-b)); transition:transform .12s, filter .2s;}
.btn:hover{filter:brightness(1.06);} .btn:active{transform:scale(.985);}
.btn.ghost{background:transparent; color:var(--txt); border:1px solid var(--line);}
.btn.gold{background:linear-gradient(90deg,#ffd27a,var(--gold-fill)); color:var(--on-gold);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btnrow{display:flex; gap:10px; margin-top:16px;}
.back{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:10px 0;font-family:'Inter';width:100%;}
.back:hover{color:var(--txt);}

/* Slider */
.field{margin:18px 0;}
.field .lab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:12px;}
.field .lab span{font-size:15px; color:var(--txt);}
.field .lab .val{font-family:'Space Grotesk'; font-weight:700; font-size:18px; color:var(--pulse); text-align:right; flex:0 0 auto;}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; background:var(--track); outline:none; margin:0;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:var(--thumb); border:6px solid var(--cloud); box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--thumb);border:6px solid var(--cloud);cursor:pointer;}
input[type=text],input[type=email],input[type=tel]{width:100%; background:var(--field); border:1px solid var(--line); border-radius:12px; padding:13px 14px; color:var(--txt); font-size:16px; font-family:'Inter';}
input::placeholder{color:var(--faint);}
input:focus{outline:2px solid var(--cloud); outline-offset:1px;}

/* Choices */
.choices{display:grid; gap:9px; margin-top:6px;}
.choices.two{grid-template-columns:1fr 1fr;}
.chip{font-family:'Inter'; text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:13px 15px; color:var(--txt); font-size:15px; cursor:pointer; transition:.15s;}
.chip:hover{border-color:var(--p2-line);}
.chip.sel{background:var(--p2-tint); border-color:var(--pulse); color:var(--txt); font-weight:600;}

/* Ergebnis */
.res{margin-top:18px; background:var(--acc-wash); border:1px solid var(--acc-line); border-radius:16px; padding:16px;}
.res .rh{font-family:'Space Grotesk'; font-weight:700; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--cloud); margin-bottom:12px;}
.stat{display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line-soft); gap:12px;}
.stat:last-child{border-bottom:0;}
.stat .k{font-size:14.5px; color:var(--muted); max-width:62%;}
.stat .v{font-family:'Space Grotesk'; font-weight:700; font-size:18px; color:var(--txt); text-align:right;}
.stat .v.warn{color:var(--warn);}
.assume{font-size:12.5px; color:var(--faint); margin-top:12px; line-height:1.55;}
.ptsgain{margin-top:14px; text-align:center; font-family:'Space Grotesk'; font-weight:600; color:var(--pulse); font-size:15.5px;}

/* Auswertung */
.ring{display:block; margin:6px auto 4px;}
.ringlabel{text-align:center; margin-bottom:8px;}
.ringlabel .big{font-family:'Space Grotesk'; font-weight:700; font-size:13.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--pulse);}
.bar{margin:13px 0;}
.bar .bl{display:flex; justify-content:space-between; font-size:14.5px; margin-bottom:6px;}
.bar .bl b{font-family:'Space Grotesk'; color:var(--txt);}
.track{height:10px; border-radius:99px; background:var(--track); overflow:hidden;}
.fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--cloud),var(--pulse)); width:0; transition:width 1s cubic-bezier(.2,.8,.2,1);}
.fill.low{background:linear-gradient(90deg,var(--warn),var(--gold-fill));}
.compare{text-align:center; margin-top:20px; font-size:15px; color:var(--txt);}
.compare b{font-family:'Space Grotesk'; color:var(--pulse); font-size:18px;}
.typ{text-align:center; font-family:'Space Grotesk'; font-weight:700; font-size:25px; margin:4px 0 2px; color:var(--cloud);}

/* KI */
.ki{white-space:pre-wrap; font-size:15.5px; line-height:1.65; color:var(--txt);}
.spin{width:22px;height:22px;border:3px solid var(--track);border-top-color:var(--pulse);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Bonus */
.bonusbar{height:16px; border-radius:99px; background:var(--track); overflow:hidden; margin:10px 0;}
.bonusfill{height:100%; background:linear-gradient(90deg,#ffd27a,var(--gold-fill)); transition:width .8s cubic-bezier(.2,.8,.2,1);}
.bonusval{text-align:center; font-family:'Space Grotesk'; font-weight:700; font-size:34px; color:var(--gold);}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line-soft);}
.row:last-child{border-bottom:0;}
.row .rl{font-size:15px; color:var(--txt);} .row .ra{font-family:'Space Grotesk'; font-weight:700; color:var(--gold); font-size:15px;}
.mini{font-family:'Space Grotesk'; font-weight:600; font-size:14px; padding:9px 15px; border-radius:10px; border:1px solid var(--pulse); background:var(--p2-wash); color:var(--pulse); cursor:pointer; white-space:nowrap;}
.mini.done{border-color:var(--line); background:var(--surface-2); color:var(--muted); cursor:default;}
.sublabel{font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--cloud); margin-bottom:4px;}

.foot{text-align:center; font-size:12.5px; color:var(--faint); margin-top:24px; line-height:1.55;}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30; background:var(--ink); border:1px solid var(--pulse); color:#fff; padding:12px 18px; border-radius:12px; font-size:15px; box-shadow:0 10px 40px rgba(0,0,0,.35);}

@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

</style>
</head>

<script>
"use strict";

/* ===================== KONFIGURATION ===================== */
const BONUS_CONFIG = {
  start: 100,            // eigenes Startguthaben bei FinanzCloud-Einrichtung (echtes Geld)
  friendGets: 100,       // Startguthaben für den/die Eingeladene:n

  // Eigene Sofort-Boni (zusätzlich, sofort ausgezahlt)

    { id: "giro", label: "Kostenloses Girokonto eröffnen", amount: 50, url: "https://www.procheck24.de/einsurance/csp/doHomepageEntry.do?cspident=D380639C061EA86621F1DEA20571D531&p=3" },
    { id: "gkv", label: "In eine günstigere Krankenkasse wechseln", amount: 100, url: "https://www.kassensucheservice.de/index.php?m=2001302&iframe=false&hint=false&untervermittler=0" },
    { id: "kreditkarte", label: "Kostenlose Kreditkarte sichern", amount: 50, url: "https://www.procheck24.de/einsurance/csp/doHomepageEntry.do?cspident=D380639C061EA86621F1DEA20571D531&p=13" },
  ],
};
const RETIRE_AGE = 67;
const PAYOUT_YEARS = 20;
const RENTE_ZINS = 0.03; // Verzinsung von vorhandenem Kapital und Sparbeitrag bis zur Rente

/* Reihenfolge dieser Variante (Cloud zuerst): der 60-Sekunden-Schnellcheck
   liefert das erste Ergebnis, ERST DANN wird die FinanzCloud angeboten.
   Vorher nach Name und Unterlagen zu fragen, kostet zu viele Aussteiger.
   Das Bonus-/Empfehlungsprogramm ist bewusst NICHT mehr Teil der
   Pflichtstrecke - es wird am Ende angeboten, damit die Expertise
   seriös bleibt. */
/* Cloud-Variante: Die FinanzCloud wird vor der Aufnahme angeboten.
   Die eigentliche Aufnahme laeuft auf EINER Seite ("aufnahme"), Block fuer
   Block wie im gedruckten Bogen. */
const STEPS = ["intro","cloud","aufnahme","termin","empfehlung","expertise"];
const LEVELS = ["rente","eigentum","vermoegen","familie","absicherung"];
/* Bereichsnamen wie in der gedruckten Expertise - Papier und Tool sprechen
   dieselbe Sprache, damit sich die Verkäufer sofort zurechtfinden. */
const LABELS = { rente:"Feierabend", eigentum:"Mietfrei wohnen", vermoegen:"Ertrag", familie:"Perspektiven für Ihre Kinder", absicherung:"Absicherung" };

/* ===================== STATE ===================== */
const state = {
  step: "intro",
  theme: (function(){ try{ return localStorage.getItem("fc_theme")==="dunkel" ? "dunkel" : "hell"; }catch(e){ return "hell"; } })(),
  prio: { rente:3, eigentum:3, vermoegen:3, familie:3, absicherung:3, steuern:3 },
  alter:38, alterPartner:38, haushalt:"allein", kinder:0, wohnstatus:"miete",
  netto:2800, nettoSelf:1600, nettoPartner:1200, miete:950, vermoegen:15000, freiBudget:300, budgetPreset:false, selbststaendig:"nein",
  /* erwProzent bleibt die Rechengroesse. Eingegeben wird aber der Euro-Betrag
     aus der Renteninformation - den hat fast jeder im Schrank, Prozent
     schaetzt dagegen kaum jemand richtig. syncRente() haelt beides zusammen. */

  nettolohnNiveau:null, zielNiveau:90, vorhandeneRente:0, vorhandenKapital:0,
  /* Selbsteinschätzung: wie viel der Lücke ist schon geschlossen? */
  lueckeGeschlossen:0, lueckeBeruehrt:false,
  wunsch:"unsicher", zusatzBudget:250, eigenkapital:20000,
  anlageform:"etf", sparbetrag:250, laufzeit:20, rendite:6,
  kindAlter:6, zielAlter:18, zielKapital:25000, startKapital:1000, familienBudget:75,
  absVorhanden:false, absVorhandenPartner:false,
  allocTotal:300, allocBasis:100, allocEtf:100, allocTagesgeld:50, allocGold:25, allocImmo:25,
  anlageTyp:"lv", anlageBeitrag:100, anlageBestand:0, anlageJahre:25, anlageAblauf:45000,
  autos:null, autoLocked:true, autoMehrUrl:"https://www.grosskundenzentrum-hamburg.de/anmeldung-html-key-tey0vxwr0xdd-b7zu",
  ratenkredite:[], mieteinnahme:0, sanierungBetrag:0,
  zEigen:3.9, tEigen:1.5, zSteuer:4.5, tSteuer:1.0, zSanier:6, jSanier:20,
  baufiMode:"", rkOpen:false,
  nebenJa:false, nebenSel:null, nettoUebernommen:false,
  /* --- Aufnahme auf einer Seite --- */
  offen:"rente",            // welcher Block gerade aufgeklappt ist
  basisFertig:false,
  /* Die Ja/Nein-Tuerfragen aus dem Papierbogen. null = noch nicht beantwortet. */

  /* Perspektiven fuer die Kinder */

  /* Ein Alter je Kind. kindAlter bleibt als Rechengröße das älteste Kind -
     es erreicht sein Ziel zuerst. */

  /* Ertrag */
  onlineBanking:null, kontoGebuehren:null, renditeBekannt:null, renditeIst:2, ruecklage:null, vermoegenErfasst:false,
  /* Mietfrei wohnen */
  absFachmann:null,
  grundstueck:null, bauZeit:null, wohnflaeche:130, grundflaeche:500, tilgungskonto:null, eigentumDetail:false,
  /* Anspruch auf Subventionen */

  absProzent:40, absBeruehrt:false,
  /* Anlagestrategie (Papierbogen Seite 3) */

  /* Prioritaeten als echte Rangfolge: Platz 1 bis 5, jeder Platz genau einmal */

  cloudOn:false, actionsDone:{}, invites:0,
  dnaNummer:null, beratungUnlocked:false,
  partner:null,
  zweitPerson:false,
  referenzen:[],
  feedback:{ gefallen:[], erwartung:[] },
  docs:[], docConsent:false,
  termin:{ thema:"", kanal:"", datum:"", slot:"", bestaetigt:false, offen:false },
  pKunden:1, pPartner1:2, pPartner2:3, pProdPartner:1,
  lead:{ name:"", name2:"", email:"", tel:"", einw:false },
};


/* ===================== THEME ===================== */
/* Die Farben leben in CSS (:root bzw. html[data-theme="dunkel"]).
   Fuer SVG brauchen wir sie als echte Werte - CSS-Variablen greifen in
   SVG-Praesentationsattributen nicht. */
function cssv(name){

/* ===================== HELFER ===================== */
const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const eur = n => (isFinite(n)?Math.round(n):0).toLocaleString("de-DE")+" €";
const eurK = n => n>=100000 ? Math.round(n/1000).toLocaleString("de-DE")+" Tsd. €" : eur(n);
function fvAnnuity(pmt,annualPct,years){ const r=annualPct/100/12, n=years*12; return r===0?pmt*n:pmt*((Math.pow(1+r,n)-1)/r); }
function pmtForTarget(target,annualPct,years){ const r=annualPct/100/12, n=years*12; return r===0?target/n:(target*r)/(Math.pow(1+r,n)-1); }

function h(tag, props, children){
  const e=document.createElement(tag);
  if(props) for(const k in props){
    const val=props[k];
    if(val==null) continue;
    if(k==="class") e.className=val;
    else if(k==="html") e.innerHTML=val;
    else if(k==="style") e.setAttribute("style",val);
    else if(k.slice(0,2)==="on" && typeof val==="function") e.addEventListener(k.slice(2).toLowerCase(),val);
    else e.setAttribute(k,val);
  }
  (children||[]).forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); });
  return e;
}
function toast(msg){
  const host=document.getElementById("toast-host");
  host.innerHTML="";
  host.appendChild(h("div",{class:"toast"},[msg]));
  setTimeout(()=>{ host.innerHTML=""; }, 2200);
}

/* Das eigene Netto - bei Paaren der eigene Anteil, denn die Renteninformation
   gilt immer nur fuer eine Person. */
function eigenesNetto(){ return Number(state.haushalt==="paar" ? state.nettoSelf : state.netto)||0; }

/* Haelt Euro-Betrag und Prozentsatz zusammen. Solange der Kunde den Regler
   nicht angefasst hat, steht ein sichtbar gekennzeichneter Richtwert drin -
   wir tun nicht so, als haette er die Zahl genannt. */
function syncRente(){
  /* Ableitungen aus den Türfragen an einer Stelle, damit Auswertung und
     Druckansicht dieselben Werte sehen wie die Aufnahme. */
  if(state.gate){
    if(state.gate.rente===true) state.zielNiveau=100;
    if(state.gate.absicherung!==null) state.absVorhanden = state.gate.absicherung===true;
    if(state.gate.eigentum===true && state.wunsch==="unsicher") state.wunsch="eigennutzung";
  }
  if(state.renteEingabe!=="euro") return;
  const n=eigenesNetto();
  if(!state.renteBeruehrt) state.renteEuro = Math.round(n*0.48/10)*10;
  state.erwProzent = n>0 ? clamp(Math.round(Number(state.renteEuro)/n*100),0,100) : 0;
}

function calc(){
  syncRente();
  const d=state;
  const netto = d.haushalt==="paar" ? (Number(d.nettoSelf)+Number(d.nettoPartner)) : Number(d.netto);
  const paar = d.haushalt==="paar";
  const nettoA = paar ? Number(d.nettoSelf) : Number(d.netto);
  const nettoB = paar ? Number(d.nettoPartner) : 0;
  const jahreBisRente=Math.max(0,RETIRE_AGE-d.alter);
  const jahreBisRenteB = paar ? Math.max(0,RETIRE_AGE-d.alterPartner) : 0;
  const gapPctMonatlich = Math.max(0, d.zielNiveau-d.erwProzent)/100;
  const lueckeA = nettoA*gapPctMonatlich;
  const lueckeB = paar ? nettoB*gapPctMonatlich : 0;
  const zielRente=netto*d.zielNiveau/100;
  const gesetzl=netto*d.erwProzent/100;
  const renteGedeckt=gesetzl;
  const renteLuecke=lueckeA+lueckeB;
  const renteKapital=renteLuecke*12*PAYOUT_YEARS;
  const kapitalZukunft=Math.round(Number(d.vorhandenKapital)*Math.pow(1+RENTE_ZINS,jahreBisRente) + fvAnnuity(Number(d.vorhandeneRente),RENTE_ZINS*100,jahreBisRente));
  const renteRest=Math.max(0,renteKapital-kapitalZukunft);
  const fvFaktor=fvAnnuity(1,RENTE_ZINS*100,jahreBisRente);
  const noetigerSparbeitrag=(renteRest>0&&fvFaktor>0)?Math.round(renteRest/fvFaktor):0;
  const grenzFor = n => n<2500?0.30:(n<4500?0.35:0.42);
  const basisBeitragA = nettoA*12*0.10, basisBeitragB = paar ? nettoB*12*0.10 : 0;
  const basisSteuerA = Math.round(basisBeitragA*grenzFor(nettoA));
  const basisSteuerB = Math.round(basisBeitragB*grenzFor(nettoB));
  const basisSteuer = basisSteuerA + basisSteuerB;
  const basisBeitrag = Math.round((basisBeitragA+basisBeitragB)/12);

  const kapitalMode=(d.wohnstatus!=="miete")||(d.wunsch==="kapitalanlage");
  const rate=kapitalMode?d.zusatzBudget:(d.miete+d.zusatzBudget);
  const grenzSteuer = grenzFor(netto);
  const annuitaet=0.045, mietRendite=0.045;
  let darlehen, immoRahmen;
  if(kapitalMode){
    // 80 % der Miete + monatlicher Eigenanteil bedienen die Annuität; Miete = Rendite auf den Objektwert
    const nenner=annuitaet-0.8*mietRendite;
    darlehen=Math.max(0,(0.8*mietRendite*d.eigenkapital + 12*d.zusatzBudget)/(nenner>0?nenner:1));
    immoRahmen=darlehen+d.eigenkapital;
  } else {
    darlehen=rate*12/annuitaet;
    immoRahmen=darlehen+d.eigenkapital;
  }

  const zielVermoegen=fvAnnuity(d.sparbetrag,d.rendite,d.laufzeit);
  const eingezahlt=d.sparbetrag*12*d.laufzeit;
  const ertrag=Math.max(0,zielVermoegen-eingezahlt);

  const kindJahre=Math.max(1,d.zielAlter-d.kindAlter);
  const startGrown=d.startKapital*Math.pow(1.03,kindJahre);
  const familieZiel=Math.max(0,d.zielKapital-startGrown);
  const familieRate=pmtForTarget(familieZiel,3,kindJahre);

  const arbeitskraftA = nettoA*12*jahreBisRente;
  const arbeitskraftB = paar ? nettoB*12*jahreBisRenteB : 0;
  const arbeitskraft = arbeitskraftA + arbeitskraftB;
  const ruecklagenMonate=netto>0?d.vermoegen/netto:0;

  const annualNet=netto*12;
  /* Solange nichts zur eigenen Vorsorge erfasst ist - und in der reinen
     Aufnahme ist das der Normalfall -, misst der Stand, wie weit die
     gesetzliche Rente das gewünschte Niveau deckt. Sobald im Termin
     Sparbeitrag oder Kapital dazukommen, zählt die gedeckte Lücke. */
  const eigenvorsorge = Number(d.vorhandeneRente)>0 || Number(d.vorhandenKapital)>0;
  /* Gesetzliche Rente plus der Teil der Lücke, den der Kunde selbst als
     geschlossen einschätzt. Beides sind seine eigenen Angaben. */
  const gedeckt = d.erwProzent + Math.max(0,d.zielNiveau-d.erwProzent)*Number(d.lueckeGeschlossen||0)/100;
  const covRente = renteLuecke<=0 ? 100
    : eigenvorsorge ? clamp(kapitalZukunft/Math.max(1,renteKapital)*100,0,100)
    : clamp(gedeckt/Math.max(1,d.zielNiveau)*100,0,100);
  const ekQuote = kapitalMode ? 0.10 : 0.15; // Kapitalanlage 10 %, Eigennutzung 15 %
  /* Ohne Angaben zu Eigenkapital und Monatsbeitrag misst der Stand, wie weit
     das Vorhaben gediehen ist: Wohnsituation, Grundstück und Zeithorizont.
     Sobald im Termin die Finanzierungsgrößen dazukommen, zählt die
     Eigenkapitalquote wie bisher. */
  const grundPkt = {ja:30, aussicht:15, nein:0}[d.grundstueck] || 0;
  const zeitPkt  = {"2j":30, "5j":20, spaeter:10, offen:0}[d.bauZeit] || 0;
  const covEigentum = d.wohnstatus==="eigentum_frei" ? 100
    : d.eigentumDetail
      ? (d.wohnstatus==="eigentum_kredit"
          ? clamp(70+(d.eigenkapital/Math.max(1,ekQuote*immoRahmen))*15,0,100)
          : clamp(d.eigenkapital/Math.max(1,ekQuote*immoRahmen)*100,0,100))
      : (d.wohnstatus==="eigentum_kredit" ? 60 : clamp(10+grundPkt+zeitPkt,0,100));
  /* Ohne erfasstes Gesamtvermögen misst der Stand, was der Bogen hergibt:
     ob Rücklagen da sind und ob das Geld überhaupt etwas erwirtschaftet. */
  const ruecklagePkt = ({ueber:30, unter:15, nein:0})[d.ruecklage] || 0;
  const renditePkt = d.renditeBekannt==="ja" ? clamp(Number(d.renditeIst)/6*60,0,60)
                   : d.renditeBekannt==="wenig" ? 8 : 0;
  const covVermoegen = d.vermoegenErfasst
    ? clamp(d.vermoegen/Math.max(1,annualNet)*100,0,100)
    : clamp(10+ruecklagePkt+renditePkt,0,100);
  const familieReached=startGrown+fvAnnuity(d.familienBudget,3,kindJahre);
  /* Ohne erfasste Zielgrößen misst der Stand, welcher Anteil des Kindergelds
     für die Zukunft des Kindes zurückgelegt wird. Erst wenn im Termin ein
     Ziel gesetzt wurde, zählt der Deckungsgrad dieses Ziels. */
  const covFamilie = d.kinder===0 ? 100
    : d.familieDetail ? clamp(familieReached/Math.max(1,d.zielKapital)*100,0,100)
    : clamp(Number(d.kindergeldAnteil||0),0,100);
  const insuredN=(d.absVorhanden?1:0)+(paar?(d.absVorhandenPartner?1:0):0), denomA=paar?2:1;
  const covAbs=clamp((insuredN/denomA)*70+Math.min(ruecklagenMonate,6)/6*30,0,100);
  const covSteuern = d.selbststaendig==="haupt"?70:(d.selbststaendig==="nebenbei"?50:20);
  const cov={ rente:covRente, eigentum:covEigentum, vermoegen:covVermoegen, familie:covFamilie, absicherung:covAbs, steuern:covSteuern };
  /* Ein "Nein" auf die Tuerfrage bedeutet: hier besteht kein Wunsch. Der Bereich
     zaehlt dann als erfuellt und zieht das Ergebnis nicht nach unten. */
  if(d.gate){
    ["rente","eigentum","vermoegen","absicherung"].forEach(k=>{ if(d.gate[k]===false) cov[k]=100; });
    /* Kinder: kein Kind = trifft nicht zu (fällt unten aus der Wertung),
       Kinder vorhanden, aber kein Wunsch = 0 %, das ist ein echter Stand. */
    if(d.gate.familie===false) cov.familie = (d.kinderVorhanden===false) ? 100 : 0;
    if(d.gate.steuern===true) cov.steuern=Math.max(cov.steuern,60);
  }
  const familieTrifftNichtZu = !!(d.gate && d.gate.familie===false && d.kinderVorhanden===false);
  const scores={ rente:Math.round(cov.rente), eigentum:Math.round(cov.eigentum), vermoegen:Math.round(cov.vermoegen), familie:Math.round(cov.familie), absicherung:Math.round(cov.absicherung) };
  /* Bereiche, die nicht zutreffen, zählen nicht mit - der Ring zeigt dann ein
     kleineres Maximum statt einer erfundenen Erfüllung. */
  const aktiveLevel = LEVELS.filter(l=>!(l==="familie" && familieTrifftNichtZu));
  const total = aktiveLevel.reduce((a,l)=>a+scores[l],0);
  const maxPunkte = aktiveLevel.length*100;
  const normiert = total/Math.max(1,maxPunkte)*500;
  const pct=Math.round(clamp(100/(1+Math.exp(-(normiert-255)/60)),5,96));

  const TYP_NAMES={ rente:"Vorsorge-Typ", eigentum:"Immobilien-Typ", vermoegen:"Vermögensaufbauer", familie:"Familienmensch", absicherung:"Sicherheits-Typ", steuern:"Steuer-Optimierer" };
  const prioTop=Object.keys(d.prio).reduce((a,b)=>d.prio[b]>d.prio[a]?b:a, "rente");
  const finanztyp=TYP_NAMES[prioTop];
  const best=aktiveLevel.reduce((a,b)=>scores[b]>scores[a]?b:a);
  const worst=aktiveLevel.reduce((a,b)=>scores[b]<scores[a]?b:a);

  return { netto,cov,grenzSteuer,kapitalMode,ekQuote,kapitalZukunft,renteRest,noetigerSparbeitrag,jahreBisRente,jahreBisRenteB,lueckeA,lueckeB,zielRente,gesetzl,renteLuecke,renteKapital,basisSteuer,basisBeitrag,
    rate,darlehen,immoRahmen,zielVermoegen,eingezahlt,ertrag,
    familieRate,familieReached,kindJahre,arbeitskraft,arbeitskraftA,arbeitskraftB,ruecklagenMonate,
    scores,total,maxPunkte,aktiveLevel,familieTrifftNichtZu,pct,finanztyp,best,worst };
}

  const eigRows=[["Mietfrei wohnen", state.gate.eigentum===true?"Ja":(state.gate.eigentum===false?"Nein":"\u2014")]];
  if(state.gate.eigentum===true){

      ["Tilgungskonto bekannt", state.tilgungskonto===true?"ja":(state.tilgungskonto===false?"nein":"\u2014")]);
    if(state.eigentumDetail) eigRows.push(["Zus\u00e4tzl. /Monat",eur(N(state.zusatzBudget))],["Eigenkapital",eurK(N(state.eigenkapital))]);
  }
  sections.push(["Mietfrei wohnen","#16a34a",eigRows]);
  const mapRuecklage={unter:"ja, unter 5.000 \u20ac",ueber:"ja, \u00fcber 5.000 \u20ac",nein:"nein"};

      ["R\u00fccklagenkonto", mapRuecklage[state.ruecklage]||"\u2014"]);

  sections.push(["Ertrag – Verm\u00f6gen & Geldanlage","#d97706",verRows]);
  if(state.kinder>0 || state.gate.familie===false){
    const kRows=[["Zukunft der Kinder sichern", state.gate.familie===true?"Ja":(state.gate.familie===false?"Nein":"\u2014")]];
    if(state.gate.familie===false) kRows.push(["Kinder im Haushalt", state.kinderVorhanden===false?"keine \u2013 Bereich trifft nicht zu":(state.kinderVorhanden===true?"ja, aber kein Thema":"\u2014")]);
    if(state.gate.familie===true){
      kRows.push(["Anteil vom Kindergeld", state.kindergeldAnteil?(state.kindergeldAnteil+" %"):"\u2014"],

        [Number(state.kinder)>1?"Alter der Kinder":"Kind heute", (Number(state.kinder)>1?kinderAlterText():(state.kindAlter+" J.")) || "\u2014"]);
      if(state.familieDetail) kRows.push(["Zielalter",state.zielAlter+" J."],

      if(String(state.kinderBisher||"").trim()) kRows.push(["Nutzt bisher",state.kinderBisher]);

    sections.push(["Perspektiven f\u00fcr Ihre Kinder","#7c3aed",kRows]);
  }
  const absRows=[[paar?"Absicherung (du)":"Absicherung",jn(state.absVorhanden)]];
  if(paar) absRows.push(["Absicherung (Partner:in)",jn(state.absVorhandenPartner)]);
  absRows.push(["Nach dem Krankengeld", state.absProzent+" % des Einkommens"+(state.absBeruehrt?"":" (Richtwert)")]);
  absRows.push(["Fehlt dann", (100-Number(state.absProzent))+" %"]);
  absRows.push(["Fachmann gew\u00fcnscht", state.absFachmann===true?"ja":(state.absFachmann===false?"nein":"\u2014")]);
  sections.push(["Absicherung","#0d9488",absRows]);
  const subRows=[["Nutzt Zusch\u00fcsse", state.gate.steuern===true?"Ja":(state.gate.steuern===false?"Nein":"\u2014")]];
  if(state.subvGenutzt && state.subvGenutzt.length) subRows.push(["Welche",state.subvGenutzt.join(", ")]);

  sections.push(["Anspruch auf Subventionen","#0891b2",subRows]);
  /* Die Rangfolge steht oben in der FinanzDNA - hier waere sie doppelt. */
  sections.push(["Anlagestrategie","#7c3aed",[
    ["Wichtigste Kriterien", state.anlageKriterien.length?anlageKriterienText():"\u2014"],

    ["Zus\u00e4tzliches Budget", anlageBudgetWert()>0?(eur(anlageBudgetWert())+" /Mon."):"\u2014"]
  ]]);
  if(state.vermoegenErfasst) verRows.push(["Gesch\u00e4tztes Gesamtverm\u00f6gen",eurK(N(state.vermoegen))]);
  const secHtml=sections.map(s=>{
    const rows=s[2].filter(Boolean).map(r=>'<tr><td class="k">'+esc(r[0])+'</td><td class="v">'+esc(r[1])+'</td></tr>').join("");
    return '<div class="card" style="--ac:'+s[1]+'"><div class="ch">'+esc(s[0])+'</div><table>'+rows+'</table></div>';
  }).join("");

  /* Die FinanzDNA eroeffnet den Ausdruck: die Zahl, und darunter jeder Punkt,
     aus dem sie besteht - in seiner Rangfolge. */

function saveToPC(){

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

function loadFromFile(file){
  const r=new FileReader();

  r.readAsText(file);
}
function loadControl(opts){

function steps(){ if(state.beratungUnlocked){ const a=STEPS.slice(); const i=a.indexOf("aufnahme"); if(i>=0 && a.indexOf("invest")<0) a.splice(i+1,0,"invest"); return a; } return STEPS; }
function idx(){ return steps().indexOf(state.step); }
function next(){ const s=steps(); go(s[Math.min(s.length-1, idx()+1)]); }
function prev(){ const s=steps(); go(s[Math.max(0, idx()-1)]); }
/* Ein Bereich gilt als erledigt, sobald seine Tuerfrage beantwortet ist -
   egal ob mit Ja oder mit Nein. */
function levelDone(){ return LEVELS.filter(l=>blockFertig(l)); }
function points(){ const c=calc(); return levelDone().filter(l=>c.aktiveLevel.indexOf(l)>=0).reduce((a,l)=>a+c.scores[l],0); }
/* Bewusst nachsichtig: Wir wollen Tippfehler abfangen, nicht Adressen
   validieren. Was hier durchkommt, prüft am Ende ohnehin ein Mensch. */
function istEmail(v){ return /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(String(v||"").trim()); }
function istTelefon(v){
  const roh=String(v||"").trim();
  if(!/^[0-9 +().\/-]+$/.test(roh)) return false;
  return roh.replace(/[^0-9]/g,"").length>=7;
}

function selfBonus(){
  let b=0; BONUS_CONFIG.actions.forEach(a=>{ if(state.actionsDone[a.id]) b+=a.amount; }); return b;

function nextTierText(){
  if(!state.cloudOn) return "Zuerst FinanzCloud einrichten – dann zählt jede Referenz.";

/* Gesetzliche Rente: Euro-Betrag als Standard, Prozent als Ausweg fuer alle,
   die den Brief gerade nicht zur Hand haben. */
/* Wie weit ist die Lücke schon geschlossen? Eine Selbsteinschätzung, keine
   Rechnung - sie gibt dem Kunden Orientierung und uns einen ehrlichen Stand,
   ohne dass wir nach Verträgen und Guthaben fragen müssen. */
function lueckeWort(v){
  if(v<=0)  return "noch gar nichts";
  if(v<20)  return "erste Schritte";
  if(v<40)  return "ein Anfang";
  if(v<60)  return "etwa die Hälfte";
  if(v<80)  return "schon ein gutes Stück";
  if(v<100) return "fast geschafft";
  return "vollständig geschlossen";
}

/* Ein Wunsch als Bild. Das verkauft besser als jede Aufzaehlung: Man sieht,
   worum es geht, bevor man ein Wort gelesen hat. */
/* Die Doppelhelix. Zwei Straenge als Kurven, dazwischen die Sprossen -
   und die Sprossen sind unsere sechs Themenfarben. Das Bild sagt in einer
   Sekunde, was der Kunde hier bekommt.
   Farben stehen fest und folgen nicht dem Theme: Der Kopf ist immer dunkel. */
function dnaHelix(){
  const W=340, H=104, mitte=H/2, amp=30, sprossen=17;
  const punkt=(i)=>{
    const t=i/(sprossen-1);
    const x=14+t*(W-28);
    const ph=t*Math.PI*2.6;
    return { x:x, y1:mitte+Math.sin(ph)*amp, y2:mitte-Math.sin(ph)*amp,
             tiefe:Math.abs(Math.cos(ph)) };
  };
  const farben=["#3b9cf0","#4fd1c5","#7c9cf5","#4fd1c5","#3b9cf0","#7c9cf5"];
  /* Die Straenge werden feiner abgetastet als die Sprossen sitzen, sonst
     sieht die Kurve eckig aus. */
  let strang1="", strang2="", rungs="";
  const fein=96;
  for(let i=0;i<fein;i++){
    const t=i/(fein-1), x=14+t*(W-28), ph=t*Math.PI*2.6;
    strang1 += (i? " L ":"M ")+x.toFixed(1)+" "+(mitte+Math.sin(ph)*amp).toFixed(1);
    strang2 += (i? " L ":"M ")+x.toFixed(1)+" "+(mitte-Math.sin(ph)*amp).toFixed(1);
  }
  for(let i=0;i<sprossen;i++){
    const p=punkt(i);
    /* Weit auseinander = vorne, eng = hinten. Die Deckkraft macht die
       Drehung sichtbar, ohne dass etwas animiert werden muss. */
    const deck=(0.22+0.62*(1-p.tiefe)).toFixed(2);
    const dick=(1.1+1.5*(1-p.tiefe)).toFixed(2);
    rungs += '<line x1="'+p.x.toFixed(1)+'" y1="'+p.y1.toFixed(1)+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y2.toFixed(1)+
             '" stroke="'+farben[i%farben.length]+'" stroke-width="'+dick+'" stroke-linecap="round" opacity="'+deck+'"/>';
    rungs += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y1.toFixed(1)+'" r="'+(2.1+1.9*(1-p.tiefe)).toFixed(1)+'" fill="#7fd4ff" opacity="'+(0.4+0.6*(1-p.tiefe)).toFixed(2)+'"/>';
    rungs += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y2.toFixed(1)+'" r="'+(2.1+1.9*(1-p.tiefe)).toFixed(1)+'" fill="#5eead4" opacity="'+(0.4+0.6*(1-p.tiefe)).toFixed(2)+'"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="xMidYMid meet" style="display:block">'+
    '<path d="'+strang1+'" fill="none" stroke="#7fd4ff" stroke-width="1.6" opacity=".55"/>'+
    '<path d="'+strang2+'" fill="none" stroke="#5eead4" stroke-width="1.6" opacity=".55"/>'+
    rungs+'</svg>';
}

function partnerChart(monthly){
  const n=12, gap=5, W=300, H=120, baseY=H-18, bw=(W-(n-1)*gap)/n;
  const maxFrac=1;
  let s='';
  for(let m=1;m<=n;m++){
    const frac=m/n, bh=Math.max(3,(H-30)*frac/maxFrac), x=(m-1)*(bw+gap), y=baseY-bh;
    const last=m===n;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(last?TH().goldFill:"url(#pg)")+'"/>';
  }
  [1,6,12].forEach(m=>{ const x=(m-1)*(bw+gap)+bw/2; s+='<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" fill="'+TH().muted+'" style="font-family:Inter;font-size:11px">M'+m+'</text>'; });
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="pg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="'+TH().cloud+'"/><stop offset="1" stop-color="'+TH().pulse+'"/></linearGradient></defs>'+s+'</svg>';
}

/* ===== Tueroeffner: ein Ergebnis in unter einer Minute =====
   Bewusst nur drei Regler und eine einzige Zahl. Wer hier den Aha-Moment
   hat, geht freiwillig in die lange Strecke - vorher fragen wir weder
   nach Namen noch nach Unterlagen. */
function screenSchnellcheck(){
  const out=h("div",{class:"res"});
  const refresh=()=>{
    /* Ohne Antwort auf die Nettolohn-Frage zeigen wir bewusst keine Zahl -
       die Luecke soll die Aussage des Kunden sein, nicht unsere Annahme. */
    if(state.nettolohnNiveau===null){
      out.innerHTML='<div class="rh">Dein Ergebnis</div><p style="font-size:15px;color:var(--muted);line-height:1.5;margin:0">Beantworte oben die erste Frage – danach rechnen wir dir deine Lücke aus.</p>';
      return;
    }
    syncRente();
    const netto=Number(state.netto);
    const ziel=Number(state.zielNiveau);
    const luecke=Math.max(0, netto*(ziel-Number(state.erwProzent))/100);
    const jahre=Math.max(0,RETIRE_AGE-Number(state.alter));
    const kapital=luecke*12*PAYOUT_YEARS;
    const gut=luecke<=0;
    let s='<div class="rh">Dein Ergebnis</div>';
    s+='<div style="text-align:center;margin:2px 0 14px">'+
       '<div class="num" style="font-family:Space Grotesk;font-weight:700;font-size:42px;line-height:1.05;color:'+(gut?'var(--pulse)':'var(--warn)')+'">'+eur(luecke)+'</div>'+
       '<div style="font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4">'+(gut
          ? 'Nach dieser groben Rechnung reicht deine Rente für dein Ziel.'
          : 'fehlen dir voraussichtlich <b style="color:var(--txt)">jeden Monat</b> im Ruhestand')+'</div>'+
       '</div>';
    s+=statRow("Jahre bis zur Rente",'<span class="num">'+jahre+'</span>');
    s+=statRow("Wunsch-Rente pro Monat ("+ziel+" % vom Netto)",'<span class="num">'+eur(netto*ziel/100)+'</span>');
    s+=statRow("Davon voraussichtlich gesetzlich",'<span class="num">'+eur(netto*Number(state.erwProzent)/100)+'</span>');
    if(!gut) s+=statRow("Grob nötiges Kapital bis dahin",'<span class="num">'+eurK(kapital)+'</span>',true);
    s+='<p class="assume">Sehr grobe Überschlagsrechnung aus deinen Angaben, Annahme: rund '+PAYOUT_YEARS+' Jahre Rentenbezug, Zielniveau '+ziel+' % vom heutigen Netto. Keine Beratung – im vollen Überblick rechnen wir mit deinen echten Zahlen.</p>';
    out.innerHTML=s;
  };
  const card=h("div",{class:"card"});
  card.appendChild(nettolohnFrage(refresh));
  card.appendChild(slider("Dein Alter","alter",18,66,1,v=>v+" Jahre",refresh));
  card.appendChild(slider("Dein Netto pro Monat (ca.)","netto",1000,8000,100,v=>"~"+eur(v),()=>{ syncRente(); refresh(); }));
  card.appendChild(renteEingabeFeld(refresh));
  refresh();

  return h("div",{class:"screen"},[
    h("div",{class:"eyebrow"},["Feierabend · Schnellcheck"]),
    h("h2",{style:"font-size:28px"},["Was bleibt dir wirklich?"]),
    h("p",{class:"lead"},["Eine Frage, drei Regler – und du hast deine Zahl. Kein Name, keine E-Mail, keine Unterlagen."]),

function levelShell(level,emoji,title,sub,fields,resultFn){

  const setOpen=o=>{ state.levelOpen[level]=o; res.style.display=o?"block":"none"; chev.textContent=o?"▾":"▸"; };

    const cc=calc();

    res.innerHTML=(p?('<div class="rh">Heute vs. möglich</div>'+potenzialSVG(p)+'<div style="height:14px"></div>'):'')+resultFn(cc);

function potenzialSVG(p){
  const covPct=clamp(p.covPct,0,100), gapPct=100-covPct;
  const W=320, barY=30, barH=26, r=8;
  const covW=W*covPct/100, gapW=W-covW;
  let s="";
  s+='<text x="2" y="16" fill="'+TH().pulse+'" style="font-family:Space Grotesk;font-weight:600;font-size:11.5px;letter-spacing:.06em">'+p.left+'</text>';
  s+='<text x="'+(W-2)+'" y="16" text-anchor="end" fill="'+TH().gold+'" style="font-family:Space Grotesk;font-weight:600;font-size:11.5px;letter-spacing:.06em">'+p.right+'</text>';
  s+='<rect x="0" y="'+barY+'" width="'+W+'" height="'+barH+'" rx="'+r+'" fill="'+TH().goldFill+'" opacity=".22"/>';
  if(covW>0) s+='<rect x="0" y="'+barY+'" width="'+covW.toFixed(1)+'" height="'+barH+'" rx="'+r+'" fill="url(#rcov)"/>';
  if(covPct>=14) s+='<text x="'+(covW/2).toFixed(0)+'" y="'+(barY+barH/2+4)+'" text-anchor="middle" fill="'+TH().onAcc+'" style="font-family:Space Grotesk;font-weight:700;font-size:14.5px">'+Math.round(covPct)+' %</text>';
  if(gapPct>=14) s+='<text x="'+(covW+gapW/2).toFixed(0)+'" y="'+(barY+barH/2+4)+'" text-anchor="middle" fill="'+TH().gold+'" style="font-family:Space Grotesk;font-weight:700;font-size:14.5px">'+Math.round(gapPct)+' %</text>';
  s+='<text x="0" y="'+(barY+barH+20)+'" fill="'+TH().muted+'" style="font-family:Inter;font-size:12px">'+p.line+'</text>';
  return '<svg width="100%" viewBox="0 0 '+W+' '+(barY+barH+30)+'" style="margin-top:4px">'+
    '<defs><linearGradient id="rcov" x1="0" x2="1"><stop offset="0" stop-color="'+TH().cloud+'"/><stop offset="1" stop-color="'+TH().pulse+'"/></linearGradient></defs>'+s+'</svg>';
}
// IST gegen SOLL/Potenzial je Bereich (Coverage kommt aus calc -> ehrlich, nur Ist-Bestand)
function bereichPotenzial(level,c){
  if(level==="familie" && state.kinder===0) return null;
  const cov=c.cov?c.cov[level]:null;
  if(cov==null) return null;
  if(level==="rente"){
    return { covPct:cov, left:"AUF KURS", right:"NOCH NÖTIG",
      line:"Nötiges Kapital ~"+eurK(c.renteKapital)+" · auf Kurs ~"+eurK(c.kapitalZukunft)+" · Lücke ~"+eur(c.renteLuecke)+"/Mon." };
  }
  if(level==="eigentum"){
    if(state.wohnstatus==="eigentum_frei")
      return { covPct:cov, left:"ERFÜLLT", right:"KAPITALANLAGE", line:"Eigenheim abbezahlt – Eigentum erfüllt. Nächster Schritt: Kapitalanlage." };
    if(state.wohnstatus==="eigentum_kredit")
      return { covPct:cov, left:"IM AUFBAU", right:"KAPITALANLAGE", line:"Du baust bereits Eigentum auf · zusätzlich möglich: Immobilie ~"+eurK(c.immoRahmen) };
    const neededEK=Math.max(1,(c.ekQuote||0.15)*c.immoRahmen);
    return { covPct:cov, left:"STARTBEREIT", right:"NOCH NÖTIG",
      line:"EK ~"+eur(state.eigenkapital)+" · empfohlen ~"+eurK(neededEK)+" ("+Math.round((c.ekQuote||0.15)*100)+" %) · Objekt ~"+eurK(c.immoRahmen) };
  }
  if(level==="vermoegen"){
    return { covPct:cov, left:"HEUTE", right:"AUFBAU",
      line:"Vermögen heute ~"+eurK(state.vermoegen)+" · Richtwert ~"+eurK(c.netto*12)+" (1 Jahreseinkommen)" };
  }
  if(level==="familie"){
    return { covPct:cov, left:"AUF KURS", right:"ES FEHLT",
      line:"Auf Kurs ~"+eurK(c.familieReached)+" · Ziel ~"+eurK(state.zielKapital) };
  }
  if(level==="absicherung"){
    return { covPct:cov, left:"HEUTE GESCHÜTZT", right:"UNGESCHÜTZT",
      line:"Arbeitskraft ~"+eurK(c.arbeitskraft)+" · Rücklagen ~"+c.ruecklagenMonate.toFixed(1)+" Mon." };
  }
  return null;
}

function impliedReturn(beitrag,jahre,ablauf,bestand){
  bestand=Number(bestand||0);
  if(jahre<=0||ablauf<=0) return null;
  if(beitrag<=0 && bestand<=0) return null;
  const f=p=>(bestand*Math.pow(1+p/100,jahre)+fvAnnuity(beitrag,p,jahre))-ablauf;
  let lo=-20,hi=20;
  if(f(lo)>0) return -20; if(f(hi)<0) return 20;
  for(let k=0;k<70;k++){ const m=(lo+hi)/2; if(f(m)>0) hi=m; else lo=m; }
  return (lo+hi)/2;
}

/* ===================== GEFÖRDERTE ALTERSVORSORGE AB 2027 =====================
   Das Altersvorsorge-Reformgesetz löst die Riester-Rente ab. Ab 1.1.2027 gibt
   der Staat auf einen geförderten Sparplan eine Zulage dazu.

   ALLE WERTE HIER ZENTRAL PFLEGEN. Stand: beschlossenes Gesetz, Inkrafttreten
   1. Januar 2027. Vor dem Livegang bitte mit euren Produktpartnern abgleichen -
   besonders die Kinderzulage, dazu unten mehr. */
const FOERDER = {
  ab: "1. Januar 2027",
  stufe1Grenze: 360,      // bis 360 € Eigenbeitrag im Jahr ...
  stufe1Satz: 0.50,       // ... legt der Staat 50 % dazu
  stufe2Grenze: 1800,     // von 360,01 € bis 1.800 € ...
  stufe2Satz: 0.25,       // ... sind es 25 %
  maxGrundzulage: 540,    // ergibt höchstens 540 € im Jahr
  kinderzulage: 300,      // je kindergeldberechtigtem Kind und Jahr
  kinderEigenbeitrag: 300 // dafür nötiger eigener Beitrag je Kind und Jahr
};

/* Was steht dem Kunden zu? Grundzulage je Person, Kinderzulage je Kind - und
   zwar nur einmal je Kind, auch wenn beide Eltern einzahlen. Sie wird dem
   Elternteil zugeordnet, für den das Kindergeld festgesetzt ist, und kann
   zwischen Eheleuten übertragen werden. */
function foerderAnspruch(){
  const personen = state.haushalt==="paar" ? 2 : 1;
  const grund = FOERDER.maxGrundzulage * personen;
  const kind  = FOERDER.kinderzulage * Math.max(0, Number(state.kinder)||0);
  return { personen:personen, grund:grund, kind:kind, gesamt:grund+kind };
}

function foerderCard(){
  const a=foerderAnspruch();
  const c=calc();
  const jahre=Math.max(1,c.jahreBisRente);
  const karte=h("div",{class:"card",style:"border-color:var(--gold-line);background:var(--gold-wash)"});
  karte.appendChild(h("div",{class:"sublabel",style:"color:var(--gold)"},["Neu ab "+FOERDER.ab]));
  karte.appendChild(h("div",{style:"font-family:Space Grotesk;font-weight:700;font-size:18px;color:var(--txt);margin-bottom:3px"},["Dein Anspruch auf staatliche Förderung"]));
  karte.appendChild(h("p",{style:"font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 10px"},
    ["Die Riester-Rente wird abgelöst. Ab "+FOERDER.ab+" steht dir das hier vom Staat zu."]));

  karte.appendChild(h("div",{style:"text-align:center;margin:8px 0 6px"},[
    h("div",{class:"num",style:"font-family:Space Grotesk;font-weight:700;font-size:40px;line-height:1.05;color:var(--gold)"},[eur(a.gesamt)]),
    h("div",{style:"font-size:14.5px;color:var(--muted);margin-top:3px"},["pro Jahr vom Staat"])
  ]));

  const d=h("div");
  let s='';
  s+=statRow(a.personen===2?"Grundzulage für euch beide":"Grundzulage für dich",
             '<span class="num">'+eur(a.grund)+'</span>'+(a.personen===2?' <span style="color:var(--muted);font-size:13px">(2 × '+eur(FOERDER.maxGrundzulage)+')</span>':''));
  if(Number(state.kinder)>0){
    s+=statRow("Kinderzulage ("+state.kinder+(Number(state.kinder)===1?" Kind":" Kinder")+")",
               '<span class="num">'+eur(a.kind)+'</span>');
  }
  s+=statRow("Bis zu deiner Rente (~"+jahre+" Jahre)",'<span class="num">'+eurK(a.gesamt*jahre)+'</span>',true);
  s+='<p class="assume">Höchstbeträge nach dem beschlossenen Altersvorsorge-Reformgesetz: bis zu '+eur(FOERDER.maxGrundzulage)+' Grundzulage je Person und Jahr, dazu '+eur(FOERDER.kinderzulage)+' je Kind. '
    +'Die Kinderzulage gibt es je Kind einmal – auch wenn ihr zu zweit seid; sie kann zwischen Eheleuten übertragen werden. '
    +'Die volle Zulage setzt einen eigenen Beitrag voraus. Vereinfachte Darstellung, keine Beratung und keine Zusage.</p>';
  d.innerHTML=s;
  karte.appendChild(d);
  return karte;
}

const VEHICLES=[
  {key:"basis", sk:"allocBasis", label:"Altersvorsorge (§ 10 EStG)", color:"#0e7c6b"},
  {key:"etf", sk:"allocEtf", label:"ETF-Sparplan", color:"#1a5cad"},
  {key:"tagesgeld", sk:"allocTagesgeld", label:"Tagesgeld", color:"#7d8ea8"},
  {key:"gold", sk:"allocGold", label:"Goldsparplan", color:"#d99a1f"},
  {key:"immo", sk:"allocImmo", label:"Immobilie (Vermietung)", color:"#6b5bd2"},
];
function effectFor(key,val){
  const H=Math.max(1, RETIRE_AGE - state.alter);
  if(val<=0) return "noch nichts zugeteilt";
  if(key==="basis")     return "Altersvorsorge + ~"+eur(Math.round(val*12*0.3))+" Steuervorteil/Jahr vom Staat";
  if(key==="etf")       return "~"+eurK(fvAnnuity(val,6,H))+" in "+H+" Jahren";
  if(key==="tagesgeld") return "Sicheres Polster: ~"+eurK(val*12)+" pro Jahr griffbereit";
  if(key==="gold")      return "~"+eurK(fvAnnuity(val,4,H))+" in "+H+" J., inflationsgeschützt";
  if(key==="immo")      return "vermietete Wohnung bis ~"+eurK(val*12/0.045)+" finanzierbar";
  return "";
}
function donutSVG(){
  const segs=VEHICLES.map(v=>({v:state[v.sk], c:v.color}));
  const sum=segs.reduce((s,x)=>s+x.v,0);
  const frei=Math.max(0,state.allocTotal-sum);
  const all=segs.slice(); if(frei>0) all.push({v:frei,c:"var(--track)"});
  const total=Math.max(sum+frei,1);
  const R=52, sw=18, C=2*Math.PI*R, cx=64, cy=64;
  let off=0, arcs="";
  all.forEach(s=>{
    if(s.v<=0) return;
    const len=C*(s.v/total);
    arcs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+s.c+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len;
  });
  return '<svg width="128" height="128" viewBox="0 0 128 128" style="display:block;margin:6px auto 0">'+arcs+
    '<text x="'+cx+'" y="'+(cy-1)+'" text-anchor="middle" fill="'+TH().txt+'" style="font-family:Space Grotesk;font-weight:700;font-size:18px">'+eur(sum)+'</text>'+
    '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" fill="'+TH().muted+'" style="font-family:Inter;font-size:11px">verteilt</text></svg>';
}
function screenStruktur(){
  const card=h("div",{class:"card"});

  const freiNode=h("div",{style:"text-align:center;font-family:Space Grotesk;font-weight:600;font-size:14.5px;margin:6px 0 4px"});
  const vehInputs=[], vehEffs=[], vehVals=[];
  const refresh=()=>{
    donutHost.innerHTML=donutSVG();
    const sum=VEHICLES.reduce((s,v)=>s+state[v.sk],0), frei=state.allocTotal-sum;
    freiNode.innerHTML = frei>0 ? ('Noch frei: <span style="color:var(--pulse)">'+eur(frei)+'</span>')
      : (frei<0 ? ('<span style="color:var(--warn)">Über Budget: '+eur(-frei)+'</span>')
      : '<span style="color:var(--pulse)">Vollständig verteilt ✓</span>');
  };
  // Gesamtbetrag (aktualisiert die Vehikel-Regler live, ohne Neu-Rendern)
  const totVal=h("span",{class:"val"}); totVal.textContent=eur(state.allocTotal);
  const totInput=h("input",{type:"range",min:100,max:1000,step:25}); totInput.value=state.allocTotal;
  totInput.addEventListener("input",()=>{
    state.allocTotal=Number(totInput.value); totVal.textContent=eur(state.allocTotal);
    VEHICLES.forEach((v,i)=>{
      vehInputs[i].max=state.allocTotal;
      if(state[v.sk]>state.allocTotal){ state[v.sk]=state.allocTotal; vehInputs[i].value=state.allocTotal; vehVals[i].textContent=eur(state[v.sk]); vehEffs[i].textContent=effectFor(v.key,state[v.sk]); }

    refresh();
  });
  card.appendChild(h("div",{class:"field"},[ h("div",{class:"lab"},[h("span",null,["Monatlich einsetzen"]),totVal]), totInput ]));
  card.appendChild(donutHost);
  card.appendChild(freiNode);
  VEHICLES.forEach((v,i)=>{
    const valSpan=h("span",{class:"val"}); valSpan.textContent=eur(state[v.sk]); vehVals[i]=valSpan;
    const input=h("input",{type:"range",min:0,max:state.allocTotal,step:25}); input.value=state[v.sk]; vehInputs[i]=input;
    const eff=h("div",{style:"font-size:12.5px;color:var(--muted);margin:-8px 0 10px 2px"}); eff.textContent=effectFor(v.key,state[v.sk]); vehEffs[i]=eff;
    input.addEventListener("input",()=>{ state[v.sk]=Number(input.value); valSpan.textContent=eur(state[v.sk]); eff.textContent=effectFor(v.key,state[v.sk]); refresh(); });
    card.appendChild(h("div",{class:"field"},[ h("div",{class:"lab"},[h("span",null,[v.label]),valSpan]), input ]));
    card.appendChild(eff);
  });
  refresh();
  return h("div",{class:"screen"},[
    h("div",{class:"eyebrow"},["So könntest du es gestalten"]),
    h("h2",{style:"font-size:26px"},["Verteil dein Budget"]),
    h("p",{class:"lead"},["Schieb dein monatliches Budget auf die Bausteine – und sieh sofort, was daraus werden kann."]),
    card,
    h("p",{class:"assume",style:"margin-top:14px"},["Vereinfachte Beispiele aus deinen Angaben, keine Beratung. Deinen genauen Mix legen wir im Termin fest."]),
    h("button",{class:"btn",style:"margin-top:8px",onClick:next},["Weiter"]),
    h("button",{class:"back",onClick:prev},["Zurück"])
  ]);
}

function screenLead(){
  const nameI=h("input",{type:"text",placeholder:"Dein Vorname"}); nameI.value=state.lead.name;
  const mailI=h("input",{type:"email",placeholder:"E-Mail-Adresse"}); mailI.value=state.lead.email;
  const telI=h("input",{type:"tel",placeholder:"Telefonnummer"}); telI.value=state.lead.tel;
  const check=h("input",{type:"checkbox",style:"margin-top:3px"}); check.checked=state.lead.einw;
  const submit=h("button",{class:"btn",style:"margin-top:16px"},["Expertise jetzt übermitteln"]);
  const validate=()=>{ submit.disabled=!(nameI.value.trim()&&mailI.value.trim()&&telI.value.trim()&&check.checked); };
  [nameI,mailI,telI].forEach(i=>i.addEventListener("input",()=>{ state.lead.name=nameI.value; state.lead.email=mailI.value; state.lead.tel=telI.value; validate(); }));
  check.addEventListener("change",()=>{ state.lead.einw=check.checked; validate(); });

/* Der letzte Schritt: die Expertise selbst. Kein generierter Text, keine
   Bewertung - nur das, was der Kunde angekreuzt hat, zum Mitnehmen. */
/* Der Überblick: alles, was der Kunde angegeben hat, in der Reihenfolge, in
   der er es gesagt hat. Keine Bewertung, keine abgeleitete Zahl. */
function uebersichtKarte(titel, zeilen){
  const gilt=zeilen.filter(z=>z && z[1]!==null && z[1]!==undefined && z[1]!=="");
  if(!gilt.length) return null;
  const karte=h("div",{class:"card"});
  karte.appendChild(h("div",{class:"sublabel"},[titel]));
  gilt.forEach(([k,v])=>{
    karte.appendChild(h("div",{style:"display:flex;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line-soft)"},[
      h("div",{style:"flex:1;font-size:14px;color:var(--muted);line-height:1.4"},[k]),
      h("div",{style:"flex:0 0 auto;max-width:58%;text-align:right;font-size:14px;font-weight:700;color:var(--txt);line-height:1.4"},[String(v)])
    ]));
  });
  return karte;
}

/* Ein Bereich: sein Platz, seine Punkte, die Kriterien dahinter und das,
   was er selbst gesagt hat. Alles an einer Stelle - das war der Punkt. */
/* Der Ring. CSS-Variablen greifen in SVG-Attributen nicht, deshalb kommen
   die Farben über TH() aus den berechneten Werten. */
function dnaRing(p){
  const t=TH();
  const r=74, umfang=2*Math.PI*r;
  const an=Math.max(0, Math.min(100, p.anteil));
  const wrap=h("div");
  wrap.innerHTML=
    '<svg class="ring" width="184" height="184" viewBox="0 0 184 184">'+
      '<defs><linearGradient id="dnag" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0%" stop-color="'+t.cloud+'"/><stop offset="100%" stop-color="'+t.pulse+'"/>'+
      '</linearGradient></defs>'+
      '<circle cx="92" cy="92" r="'+r+'" fill="none" stroke="'+t.track+'" stroke-width="13"/>'+
      '<circle cx="92" cy="92" r="'+r+'" fill="none" stroke="url(#dnag)" stroke-width="13" stroke-linecap="round"'+
        ' stroke-dasharray="'+umfang.toFixed(1)+'" stroke-dashoffset="'+(umfang*(1-an/100)).toFixed(1)+'"'+
        ' transform="rotate(-90 92 92)"/>'+
      '<text x="92" y="88" text-anchor="middle" fill="'+t.txt+'" style="font-family:Space Grotesk;font-weight:700;font-size:46px">'+p.wert+'</text>'+
      '<text x="92" y="113" text-anchor="middle" fill="'+t.muted+'" style="font-family:Space Grotesk;font-size:13.5px;letter-spacing:.08em">von '+p.skala+' Punkten</text>'+
    '</svg>';
  return wrap;
}

/* Der Kopf des Ergebnisses - dasselbe Bild wie auf der Startseite. Anfang
   und Ende zeigen dieselbe Helix, das schliesst den Kreis. Die Farben stehen
   fest, weil der Block in beiden Themes dunkel ist. */
function dnaKopf(p){
  const kopf=h("div",{style:
    "position:relative;overflow:hidden;border-radius:18px;padding:16px 18px 20px;margin-bottom:16px;"+
    "background:linear-gradient(155deg,#0a1729 0%,#12213D 46%,#173a6b 100%);"+
    "box-shadow:0 12px 34px rgba(10,23,41,.28)"});

  kopf.appendChild(h("div",{style:"opacity:.75",html:dnaHelix()}));

  /* Ring in hellen Farben - er sitzt immer auf dunklem Grund. */
  const r=70, umfang=2*Math.PI*r, an=Math.max(0,Math.min(100,p.anteil));
  const ring=h("div",{style:"margin-top:-6px"});
  ring.innerHTML=
    '<svg viewBox="0 0 176 176" width="176" height="176" style="display:block;margin:0 auto">'+
      '<defs><linearGradient id="dnaring" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0%" stop-color="#7fd4ff"/><stop offset="100%" stop-color="#5eead4"/></linearGradient></defs>'+
      '<circle cx="88" cy="88" r="'+r+'" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="12"/>'+
      '<circle cx="88" cy="88" r="'+r+'" fill="none" stroke="url(#dnaring)" stroke-width="12" stroke-linecap="round"'+
        ' stroke-dasharray="'+umfang.toFixed(1)+'" stroke-dashoffset="'+(umfang*(1-an/100)).toFixed(1)+'"'+
        ' transform="rotate(-90 88 88)"/>'+
      '<text x="88" y="84" text-anchor="middle" fill="#fff" style="font-family:Space Grotesk;font-weight:700;font-size:46px">'+p.wert+'</text>'+
      '<text x="88" y="109" text-anchor="middle" fill="#9ec6ff" style="font-family:Space Grotesk;font-size:13px;letter-spacing:.08em">von '+p.skala+' Punkten</text>'+
    '</svg>';
  kopf.appendChild(ring);

  kopf.appendChild(h("div",{style:"text-align:center;font-family:Space Grotesk;font-weight:700;font-size:23px;color:#fff;margin-top:2px"},[p.stufe.name]));
  kopf.appendChild(h("div",{style:"text-align:center;font-size:12.5px;color:#9ec6ff;margin-top:2px;margin-bottom:14px"},["Stufe "+p.stufeNr+" von "+p.stufen+" · "+p.anteil+" % erfüllt"]));

  const leiter=h("div",{style:"display:flex;gap:5px"});
  DNA_STUFEN.forEach((st,i)=>{
    const hier=(i+1)===p.stufeNr, erreicht=(i+1)<=p.stufeNr;
    leiter.appendChild(h("div",{style:"flex:1;text-align:center"},[
      h("div",{style:"height:6px;border-radius:4px;background:"+(erreicht?"linear-gradient(90deg,#7fd4ff,#5eead4)":"rgba(255,255,255,.16)")}),
      h("div",{style:"margin-top:6px;font-size:9.5px;line-height:1.2;font-weight:"+(hier?"800":"600")+";color:"+(hier?"#7fd4ff":"rgba(255,255,255,.42)")},[st.name])
    ]));
  });
  kopf.appendChild(leiter);
  return kopf;
}

function ueberblick(){
  const box=h("div");
  const paar=state.haushalt==="paar";
  const N=v=>Number(v||0);
  const jn=v=>v===true?"ja":(v===false?"nein":null);
  const mapWohn={miete:"zur Miete",eigentum_kredit:"Eigentum, mit Kredit",eigentum_frei:"Eigentum, abbezahlt"};
  const mapSelb={nein:"nein",nebenbei:"ja, nebenbei",haupt:"ja, hauptberuflich"};
  const mapGrund={ja:"vorhanden",aussicht:"in Aussicht",nein:"noch keins"};
  const mapBau={"2j":"in den nächsten 2 Jahren","5j":"in 2 bis 5 Jahren",spaeter:"später",offen:"noch offen"};
  const mapGeb={ohne:"kostenlos",mit:"mit Gebühren",unklar:"weiß ich nicht genau"};
  const mapRueck={unter:"ja, unter 5.000 €",ueber:"ja, über 5.000 €",nein:"nein"};
  const zu=(k)=>state.gate[k]===true?"ja":(state.gate[k]===false?"nein":null);
  const add=(t,z)=>{ const k=uebersichtKarte(t,z); if(k) box.appendChild(k); };

  add("Zur Person",[
    ["Name", [state.lead.name,state.lead.name2].filter(x=>String(x||"").trim()).join(" & ")],
    ["Haushalt", paar?"zu zweit":"allein"],
    ["Alter", state.basisFertig ? (state.alter+" Jahre"+(paar?" · Partner:in "+state.alterPartner+" Jahre":"")) : null],
    ["Kinder", N(state.kinder)>0 ? (state.kinder+(N(state.kinder)===1?" Kind":" Kinder")+(kinderAlterText()?" ("+kinderAlterText()+")":"")) : "keine"],
    ["Netto pro Monat", state.basisFertig ? ("~"+eur(paar?(N(state.nettoSelf)+N(state.nettoPartner)):N(state.netto))) : null],
    ["Wohnen", state.basisFertig ? (mapWohn[state.wohnstatus]+(N(state.miete)>0?" · "+eur(state.miete)+"/Monat":"")) : null],
    ["Selbstständig", state.basisFertig ? mapSelb[state.selbststaendig] : null]
  ]);

  /* Die sechs Zielbereiche und die Rangfolge stehen oben in der FinanzDNA -
     hier stuenden sie ein zweites Mal. Im Ausdruck bleiben sie vollstaendig. */

  add("Anlagestrategie",[
    ["Wichtigste Kriterien", state.anlageKriterien.length ? anlageKriterienText() : null],
    ["Laufzeit", state.anlageLaufzeit!==null ? ANLAGE_LAUFZEITEN[state.anlageLaufzeit]+" Jahre" : null],
    ["Zusätzliches Budget", anlageBudgetWert()>0 ? eur(anlageBudgetWert())+"/Monat" : null]
  ]);

  const t=state.termin;
  if(t && (t.thema||t.datum||t.offen)){
    add("Dein Termin", t.offen
      ? [["Terminwunsch","offen – telefonische Rücksprache"],["Thema",t.thema||null]]
      : [["Thema",t.thema||null],["Kanal",kanalLabel(t.kanal)||null],
         ["Wunschtermin", t.datum ? t.datum+(t.slot?" · "+t.slot+" Uhr":"") : null],
         ["Status", t.bestaetigt?"angefragt":"in Auswahl"]]);
  }

  if(state.referenzen && state.referenzen.length){
    add("Deine Referenzen", state.referenzen.map((r,i)=>
      ["Referenz "+(i+1), [r.name,r.email,r.tel].filter(Boolean).join(" · ")]));
  }

  const fbA=x=>Array.isArray(x)?x:(x?[x]:[]);
  const fbG=fbA(state.feedback&&state.feedback.gefallen), fbE=fbA(state.feedback&&state.feedback.erwartung);
  if(fbG.length||fbE.length){
    add("Dein Feedback",[
      ["Am besten gefallen", fbG.join(", ")||null],
      ["Erwartung an den Termin", fbE.join(", ")||null]
    ]);
  }
  return box;
}

function naechsteTermine(count){
  const out=[], d=new Date(); d.setHours(0,0,0,0);
  while(out.length<count){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) out.push(new Date(d)); }
  return out;
}
function fmtDatum(d){ return WD[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+"."; }

    let right;
    if(done){
      right=h("button",{class:"mini done"},["✓ erledigt"]);

  ]);

  // Gesamt-Summe (alles zusammengezählt)
  const gesamt=(state.cloudOn?BONUS_CONFIG.start:0)+selfBonus()+referralBonus();
  const trow=(label,val)=>h("div",{class:"row"},[

function navClip(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); } else { const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); } }catch(e){} }
function partnerEncode(p){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }catch(e){ return ""; } }
function partnerDecode(s){ try{ s=String(s).replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
function partnerLink(p){ return location.origin+location.pathname+"#p="+partnerEncode(p); }
function loadPartners(){ try{ return JSON.parse(localStorage.getItem("fc_partners")||"[]"); }catch(e){ return []; } }
function savePartners(arr){ try{ localStorage.setItem("fc_partners",JSON.stringify(arr)); }catch(e){} }
function initFromUrl(){
  try{
    const hsh=location.hash||"", srch=location.search||"";
    if(/(^|[?&])admin($|[=&])/.test(srch) || /^#admin\b/.test(hsh)){ state.step="admin"; return; }
    const m=hsh.match(/[#&]p=([^&]+)/);
    if(m){ const p=partnerDecode(m[1]); if(p&&typeof p==="object") state.partner=p; }
  }catch(e){}
}

    const delBtn=h("button",{class:"mini"},["Löschen"]);
    delBtn.addEventListener("click",()=>{ const l=loadPartners(); l.splice(i,1); savePartners(l); toast("Gelöscht"); render(); });
    listCard.appendChild(h("div",{style:"border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px"},[
      h("div",{style:"font-weight:700;color:var(--txt);font-size:15px"},[p.name||"(ohne Name)"]),
      h("div",{style:"font-size:13.5px;color:var(--muted);margin:2px 0 7px"},[ (p.tel||"")+(p.email?((p.tel?" · ":"")+p.email):"") ]),
      h("div",{style:"font-size:12.5px;color:var(--faint);word-break:break-all;margin-bottom:9px"},[ "Upload-Link: "+(p.url||"—") ]),
      h("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},[ copyBtn, openBtn, editBtn, delBtn ])
    ]));
  });

  const exportBtn=h("button",{class:"mini"},["Sichern (Datei)"]);
  exportBtn.addEventListener("click",()=>{
    try{ const blob=new Blob([JSON.stringify(loadPartners(),null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="FinanzCloud-Partner.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast("Partnerliste gesichert"); }catch(e){ toast("Sichern nicht möglich"); }
  });
  const importIn=h("input",{type:"file",accept:"application/json",style:"display:none"});
  importIn.addEventListener("change",()=>{ const f=importIn.files&&importIn.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const arr=JSON.parse(r.result); if(Array.isArray(arr)){ savePartners(arr); toast("Partnerliste geladen"); render(); } else toast("Ungültige Datei"); }catch(e){ toast("Datei konnte nicht gelesen werden"); } }; r.readAsText(f); });
  const importBtn=h("button",{class:"mini"},["Wiederherstellen"]);
  importBtn.addEventListener("click",()=>importIn.click());

  return h("div",{class:"screen"},[
    h("div",{class:"eyebrow"},["Intern · Partner-Verwaltung"]),
    h("h2",{style:"font-size:24px"},["Geschäftspartner verwalten"]),
    h("p",{class:"lead"},["Lege je Partner Name, Kontakt und seinen Upload-Link an. Du bekommst einen personalisierten App-Link – wer ihn öffnet, sieht überall diskret die Partnerdaten, lädt über dessen Link hoch und bekommt den Kontakt aufs PDF."]),
    card, listCard,

    h("p",{class:"foot"},["Gespeichert wird lokal in diesem Browser. Über die Schaltfläche Sichern kannst du die Liste übertragen oder sichern."]),
    h("button",{class:"back",style:"margin-top:10px",onClick:()=>{ state.partner=null; state.step="intro"; render(); }},["Zur App"])
  ]);
}

/* Bildbanner. Ohne hinterlegtes Bild kommt gar nichts zurück. */
function bildBanner(id, randStil){
  let src=BILDER[id];
  /* Ein Eintrag darf auch auf einen anderen Block verweisen, statt das Bild
     ein zweites Mal in die Datei zu schreiben. */
  if(src && src.slice(0,5)!=="data:") src=BILDER[src];
  if(!src) return null;
  return h("div",{style:(randStil||"margin:2px 0 14px")+";border-radius:13px;overflow:hidden;background:var(--surface-2);aspect-ratio:2.2 / 1"},[
    h("img",{src:src, alt:(BILD_ALT[id]||""), loading:"lazy",
      style:"width:100%;height:100%;object-fit:cover;display:block"})
  ]);
}

/* ===================== AUFNAHME – EINE SEITE, BLOCK FÜR BLOCK =====================
   Aufbau wie die gedruckte Expertise: Jeder Block beginnt mit der Ja/Nein-Frage
   aus dem Bogen. Erst ein "Ja" öffnet die Detailfragen. Beantwortete Blöcke
   klappen zu einer Ergebniszeile zusammen – so bleibt die Seite kurz und man
   sieht trotzdem den ganzen Weg.
   Bewusst KEINE Beratung in diesem Teil: hier wird nur aufgenommen. Die tiefen
   Rechner liegen weiter hinter der Beratungsfreigabe.
   ================================================================================ */

/* Kindergeld pro Kind und Monat – Stand Januar 2026: 259 €.
   Ändert sich der Satz, wird NUR dieser Wert angefasst. */
const KINDERGELD = 259;

/* Reihenfolge der Blöcke = Reihenfolge im Papierbogen */
/* Reihenfolge wie im Gespraech: erst die Wuensche, dann die Priorisierung,
   ganz zuletzt die persoenlichen Eckdaten. */
const BLOCK_ORDER = ["rente","familie","vermoegen","eigentum","steuern","absicherung","prio","anlage","basis"];

function blockSichtbar(id){
  /* Der Kinder-Block ist immer da - ob Kinder im Haushalt leben, fragt er
     selbst. Vorher wussten wir es aus der Ausgangslage, die steht jetzt hinten. */
  return true;
}
function naechsterBlock(id){
  const i=BLOCK_ORDER.indexOf(id);
  for(let k=i+1;k<BLOCK_ORDER.length;k++){ if(blockSichtbar(BLOCK_ORDER[k])) return BLOCK_ORDER[k]; }
  return null;
}
function oeffneBlock(id){
  state.offen = (state.offen===id) ? null : id;
  renderScreenKeepStep(); scrollZuBlock(id);
}
function weiterZu(id){
  if(!id){ next(); return; }
  state.offen=id; renderScreenKeepStep(); scrollZuBlock(id);
}
function scrollZuBlock(id){
  setTimeout(()=>{ const el=document.getElementById("blk-"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); },70);
}

/* ---- Bausteine ---- */

/* Die Ja/Nein-Türfrage aus dem Formular. Ohne Antwort bleibt der Block zu. */
/* Bei diesen Blöcken bleibt nach einem "Nein" noch etwas zu beantworten -
   sie dürfen deshalb nicht automatisch zuklappen. */
const NACH_NEIN_OFFEN = ["steuern","absicherung"];

function torfrage(text, key){
  const wrap=h("div");
  wrap.appendChild(h("p",{style:"font-size:16px;color:var(--txt);line-height:1.45;margin:0 0 12px"},[text]));
  const box=h("div",{class:"choices two"});
  [[true,"Ja"],[false,"Nein"]].forEach(([v,l])=>{
    const b=h("button",{class:"chip"+(state.gate[key]===v?" sel":""),style:"text-align:center;font-weight:600"},[l]);
    b.addEventListener("click",()=>{
      state.gate[key]=v;
      /* Wer "Nein" sagt, hat den Wunsch abgelehnt - der Rest des Wohn-,
         Renten- oder Ertragsblocks entfällt, wir springen weiter.
         NICHT so bei den Blöcken in NACH_NEIN_OFFEN: dort folgt auch nach
         einem "Nein" noch eine Frage, die gestellt werden muss. */
      if(v===false && key==="steuern"){ state.subvGenutzt=[]; }
      const springen = (v===false) && NACH_NEIN_OFFEN.indexOf(key)<0;
      const ziel = springen ? naechsterBlock(key) : null;
      if(ziel) state.offen=ziel;
      renderScreenKeepStep();
      if(ziel) scrollZuBlock(ziel);
    });
    box.appendChild(b);
  });
  wrap.appendChild(box);
  return wrap;
}
function blockVonGate(key){ return key; }

/* Auswahlreihe für alles, was nicht im flachen state liegt */
function wahlReihe(optionen, istGewaehlt, onWahl, spalten){
  const wrap=h("div",{class:"choices"+(spalten===2?" two":"")});
  optionen.forEach(([v,l])=>{
    const b=h("button",{class:"chip"+(istGewaehlt(v)?" sel":"")},[l]);
    b.addEventListener("click",()=>{ onWahl(v); renderScreenKeepStep(); });
    wrap.appendChild(b);
  });
  return wrap;
}
function frageZeile(text){
  return h("div",{style:"font-size:15px;color:var(--txt);line-height:1.4;margin:18px 0 9px"},[text]);
}
function freitext(text, key){
  const wrap=h("div",{style:"margin-top:18px"});
  wrap.appendChild(h("div",{style:"font-size:15px;color:var(--txt);line-height:1.4;margin-bottom:8px"},[text]));
  const inp=h("input",{type:"text",placeholder:"optional",value:state[key]||""});
  inp.addEventListener("input",()=>{ state[key]=inp.value; });
  wrap.appendChild(inp);
  return wrap;
}
/* Der Spiegel statt der Rechnung: Hier steht nur, was der Kunde selbst
   angegeben hat. Er zieht seine Schluesse daraus von allein - das wirkt
   staerker als eine Zahl, die wir ihm vorrechnen, und es macht den Termin
   zum naechsten Schritt statt zum Nachklapp. */
function notiertKasten(zeilen, hinweis){
  const d=h("div",{style:"margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:14px 15px"});
  d.appendChild(h("div",{class:"sublabel"},["Notiert"]));
  zeilen.filter(Boolean).forEach(z=>d.appendChild(
    h("div",{style:"font-size:14.5px;color:var(--txt);line-height:1.5;margin-top:5px"},["· "+z])));
  d.appendChild(h("p",{class:"assume",style:"margin-top:11px"},
    [hinweis||"Was daraus folgt, schauen wir uns gemeinsam im Termin an."]));
  return d;
}

/* Der Kunde bittet selbst um die Vertiefung, statt dass wir sie ihm anbieten.
   Das ist ehrlich - es ist eine echte Wahl - und im Gespräch stärker: Wer
   "ja" angetippt hat, kommt mit einer eigenen Frage in den Termin.
   Bewusst allgemein gehalten, damit wir das später auch bei anderen
   Blöcken einsetzen können. */
function fachmannFrage(key, frage, hinweis){
  const wrap=h("div",{style:"margin-top:20px;border:1px solid var(--acc-line);background:var(--acc-wash);border-radius:14px;padding:15px"});
  wrap.appendChild(h("div",{style:"font-size:15.5px;color:var(--txt);line-height:1.45;margin-bottom:4px;font-weight:600"},[frage]));
  if(hinweis) wrap.appendChild(h("p",{style:"font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 11px"},[hinweis]));
  const box=h("div",{class:"choices two"});
  [[true,"Ja, gerne"],[false,"Nein, danke"]].forEach(([v,l])=>{
    const b=h("button",{class:"chip"+(state[key]===v?" sel":""),style:"text-align:center;font-weight:600"},[l]);
    b.addEventListener("click",()=>{ state[key]=v; renderScreenKeepStep(); });
    box.appendChild(b);
  });
  wrap.appendChild(box);
  return wrap;
}

function ergebnisKasten(innerHtml){
  const d=h("div",{class:"res"}); d.innerHTML=innerHtml; return d;
}

/* ---- Fertig-Status und Kurzfassungen ---- */
function blockFertig(id){
  const g=state.gate;
  if(id==="basis") return !!state.basisFertig;
  if(id==="familie") return (g.familie===false && state.kinderVorhanden!==null) || (g.familie===true && Number(state.kinder)>0 && state.kindergeldAnteil!==null);
  if(id==="prio") return rangVollstaendig();
  if(id==="anlage") return state.anlageKriterien.length===2 && state.anlageLaufzeit!==null && anlageBudgetWert()>0;
  if(id==="absicherung") return g.absicherung!==null && state.absFachmann!==null;
  if(id==="steuern") return g.steuern!==null && state.subvInfo!==null && state.beispiele!==null;
  /* Achtung: Eine unbeantwortete Torfrage ist NICHT fertig. "!==true" hätte
     auch null durchgelassen - der Block bekam den Haken, bevor überhaupt
     etwas ausgefüllt war. */
  if(id==="vermoegen"){
    if(g.vermoegen===null) return false;
    if(g.vermoegen===false) return true;
    return state.onlineBanking!==null && !!state.renditeBekannt
        && (state.anlagenHeute||[]).length>0 && !!state.ruecklage;
  }
  if(id==="rente"||id==="eigentum") return g[id]!==null;
  return false;
}
function blockKurz(id){
  const c=calc(), g=state.gate;
  const nein="— nicht gewünscht";
  if(id==="basis"){
    if(!state.basisFertig) return "Alter, Einkommen, Wohnen";
    const teile=[state.alter+" J.", "~"+eur(c.netto)+" netto"];
    if(Number(state.kinder)>0) teile.push(state.kinder+(Number(state.kinder)===1?" Kind":" Kinder"));
    teile.push(state.wohnstatus==="miete"?"zur Miete":"im Eigentum");
    return teile.join(" · ");
  }
  if(id==="rente"){
    if(g.rente===null) return "Ruhestand auf Nettolohn-Niveau?";
    if(g.rente===false) return nein;
    /* Ohne Beratungsfreigabe spiegeln wir nur die Angabe - keine gerechnete Lücke. */
    if(state.beratungUnlocked) return c.renteLuecke>0 ? ("Lücke "+eur(c.renteLuecke)+"/Monat") : "keine Lücke erkennbar";
    const r=(state.renteEingabe==="euro"&&state.renteBeruehrt) ? (eur(state.renteEuro)+" gesetzl.") : (state.erwProzent+" % gesetzl.");
    return "Nettolohn-Niveau gewünscht · "+r+(state.lueckeBeruehrt?(" · Lücke zu "+state.lueckeGeschlossen+" % geschlossen"):"");
  }
  if(id==="familie"){
    if(g.familie===null) return "Zukunft der Kinder sichern?";
    if(g.familie===false) return state.kinderVorhanden===false ? "keine Kinder – trifft nicht zu"
                               : state.kinderVorhanden===true ? "Kinder da, aber kein Thema" : nein;
    return state.kindergeldAnteil ? (state.kindergeldAnteil+" % vom Kindergeld · "+eur(kindergeldRate())+"/Monat") : "Anteil noch offen";
  }
  if(id==="vermoegen"){
    if(g.vermoegen===null) return "Kapital attraktiv vermehren?";
    if(g.vermoegen===false) return nein;
    /* Die Gebuehrenangabe gehoert nur dazu, solange Online-Banking auf "ja" steht. */
    const geb = state.onlineBanking===true ? state.kontoGebuehren : null;
    const konto = geb==="mit" ? " · Konto mit Gebühren" : geb==="ohne" ? " · Konto kostenlos" : "";
    const wo = anlagenText() ? " · "+anlagenText() : "";
    return "Rendite "+renditeText()+konto+wo+(state.ruecklage&&state.ruecklage!=="nein"?" · Rücklage "+(state.ruecklage==="ueber"?"über":"unter")+" 5.000 €":"");
  }
  if(id==="eigentum"){
    if(g.eigentum===null) return "Künftig mietfrei wohnen?";
    if(g.eigentum===false) return nein;
    if(state.beratungUnlocked) return "Rahmen ~"+eurK(c.immoRahmen);
    const mapG={ja:"Grundstück vorhanden",aussicht:"Grundstück in Aussicht",nein:"kein Grundstück"};
    return [mapG[state.grundstueck], state.wohnflaeche+" m² geplant"].filter(Boolean).join(" · ") || "mietfrei wohnen gewünscht";
  }
  if(id==="steuern"){
    if(g.steuern===null) return "Staatliche Zuschüsse";
    if(g.steuern===false) return "nutzt bisher keine";
    return state.subvGenutzt.length ? state.subvGenutzt.join(", ") : "genutzt, noch nicht benannt";
  }
  if(id==="absicherung"){
    if(g.absicherung===null) return "Einkommen abgesichert?";
    const fm = state.absFachmann===true ? " · Fachmann gewünscht" : "";
    return (g.absicherung ? "Absicherung vorhanden" : "keine Absicherung")+" · danach "+state.absProzent+" %"+fm;
  }
  if(id==="anlage"){
    if(!blockFertig("anlage")) return "2 Kriterien, Laufzeit, Budget";
    return anlageKriterienText()+" · "+ANLAGE_LAUFZEITEN[state.anlageLaufzeit]+" J. · "+eur(anlageBudgetWert());
  }
  if(id==="prio"){
    if(!rangVollstaendig()) return "Rangfolge 1 bis 5";
    const top=aktivePrioZiele().find(z=>state.rang[z[0]]===1);
    return top ? ("Platz 1: "+top[1]) : "";
  }
  return "";
}

/* Hält die Altersliste auf die Kinderzahl passend und pflegt kindAlter. */
function syncKinderAlter(){
  const anz=Math.max(0,Number(state.kinder)||0);
  if(!Array.isArray(state.kinderAlter)) state.kinderAlter=[];
  while(state.kinderAlter.length<anz) state.kinderAlter.push(6);
  if(state.kinderAlter.length>anz) state.kinderAlter.length=anz;
  if(anz>0) state.kindAlter=Math.max.apply(null,state.kinderAlter);
}
function kinderAlterText(){
  if(!state.kinderAlter||!state.kinderAlter.length) return "";
  return state.kinderAlter.map(a=>a+" J.").join(" · ");
